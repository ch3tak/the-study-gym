# CBSE Class 9 Science (086), 2026-27: the curriculum spine.
#
# Source: CBSE Secondary Curriculum 2026-27, Science Class IX
# (docs/sources/cbse-2026-27-class9-science.pdf). New NCF-SE 2023 syllabus:
# integrated Biology, Chemistry, Physics and Earth Science. Gravitation,
# momentum and "Is matter around us pure" as a separate chapter are NOT in the
# 2026-27 Class 9 list; don't add them back.
#
# Chapter numbers follow the CBSE unit table (Unit I: 2,3,11,12; II: 5,8,9;
# III: 4,6,7,10; IV: 13). Ids are permanent and globally unique (`c9.` prefix).

schema_version: 1
board: cbse
class: 9
subject: science
name: Science
academic_year: "2026-27"
status: live
total_marks: 80          # annual theory paper; internal assessment (20) is out of scope
default_half_life_days: 3   # fact-heavy: slower initial decay, more spaced review

question_rules:
  numeric_requires_unit: true   # every numeric answer states its SI unit ("none" if dimensionless)

sources:
  - "CBSE Secondary Curriculum 2026-27, Science (086) Class IX (cbseacademic.nic.in)"
  - "NCERT Science Textbook for Class IX (2026-27 edition)"

units:
  - {id: world_of_living, name: World of Living,               marks: 27}
  - {id: matter,          name: Matter - Its Nature and Behaviour, marks: 25}
  - {id: motion_force,    name: "Motion, Force, Work and Sound", marks: 23}
  - {id: earth_system,    name: Earth as a System,             marks: 5}

chapters:

  # ===========================================================================
  # Unit I: World of Living (27)
  # ===========================================================================
  - id: cell
    name: Cell
    chapter_number: 2
    unit: world_of_living
    board_weight_marks: 7
    board_weight_is_estimate: true
    default_question_types: [mcq, assertion_reason, case_based]
    concepts:
      - id: c9.cell.discovery
        name: Discovery of the cell and cell theory
        description: "Hooke's cork cells, Leeuwenhoek's living cells, and the cell as the structural and functional unit of life."
        prerequisites: []
        misconceptions:
          - id: c9.cell.disc.hooke_living
            description: "Thinks Hooke saw living cells (he saw dead cork cells)"
            detect: "distractor"
      - id: c9.cell.prokaryote_eukaryote
        name: Prokaryotic and eukaryotic cells
        description: "Prokaryotes lack a nuclear membrane and membrane-bound organelles; eukaryotes have them."
        prerequisites: [c9.cell.discovery]
        misconceptions:
          - id: c9.cell.pro.no_dna
            description: "Thinks prokaryotes have no DNA because they have no nucleus"
            detect: "distractor"
          - id: c9.cell.pro.no_ribosomes
            description: "Thinks prokaryotes lack ribosomes"
            detect: "distractor"
      - id: c9.cell.plant_vs_animal
        name: Plant and animal cells
        description: "Cell wall, chloroplasts and a large central vacuole in plant cells; centrioles and small vacuoles in animal cells."
        prerequisites: [c9.cell.discovery]
        misconceptions:
          - id: c9.cell.pva.animal_wall
            description: "Thinks animal cells have a cell wall"
            detect: "distractor"
          - id: c9.cell.pva.all_plant_chloroplast
            description: "Thinks every plant cell (e.g. root cells) has chloroplasts"
            detect: "distractor"
      - id: c9.cell.plasma_membrane
        name: Plasma membrane and permeability
        description: "The plasma membrane is selectively permeable and controls entry and exit of substances."
        prerequisites: [c9.cell.plant_vs_animal]
        misconceptions:
          - id: c9.cell.pm.fully_permeable
            description: "Thinks the membrane lets everything through, like the cell wall"
            detect: "distractor"
      - id: c9.cell.diffusion_osmosis
        name: Diffusion and osmosis
        description: "Diffusion of substances, osmosis of water through a selectively permeable membrane; hypotonic, isotonic and hypertonic solutions; plasmolysis."
        prerequisites: [c9.cell.plasma_membrane]
        misconceptions:
          - id: c9.cell.osm.direction
            description: "Thinks water moves from the more concentrated solution to the less concentrated one"
            detect: "distractor"
          - id: c9.cell.osm.solute_moves
            description: "Thinks osmosis is the movement of solute rather than water"
            detect: "distractor"
      - id: c9.cell.cell_wall
        name: Cell wall
        description: "Cellulose cell wall gives plant cells shape and protection and lets them withstand hypotonic solutions."
        prerequisites: [c9.cell.plant_vs_animal]
        misconceptions:
          - id: c9.cell.wall.selective
            description: "Thinks the cell wall is selectively permeable"
            detect: "distractor"
      - id: c9.cell.nucleus
        name: Nucleus
        description: "Nuclear membrane, chromatin and chromosomes; the nucleus controls cell activities and carries hereditary information."
        prerequisites: [c9.cell.prokaryote_eukaryote]
        misconceptions:
          - id: c9.cell.nuc.chromosomes_always
            description: "Thinks chromosomes are visible at all times rather than only during division"
            detect: "distractor"
      - id: c9.cell.organelles
        name: Mitochondria, plastids, ER and vacuoles
        description: "Mitochondria (energy/ATP), chloroplasts (photosynthesis), ER (transport, synthesis), vacuoles (storage, turgidity)."
        prerequisites: [c9.cell.plant_vs_animal]
        misconceptions:
          - id: c9.cell.org.mito_makes_energy
            description: "Thinks mitochondria create energy from nothing rather than releasing it from food"
            detect: "distractor"
          - id: c9.cell.org.function_swap
            description: "Swaps the functions of two organelles (e.g. chloroplast and mitochondrion)"
            detect: "distractor"
      - id: c9.cell.cell_division
        name: Cell division and cancer
        description: "Mitosis (growth, repair; identical cells) vs meiosis (gametes; half chromosome number, variation); uncontrolled division as cancer."
        prerequisites: [c9.cell.nucleus]
        misconceptions:
          - id: c9.cell.div.meiosis_growth
            description: "Thinks meiosis is used for growth and repair"
            detect: "distractor"
          - id: c9.cell.div.same_number
            description: "Thinks meiosis keeps the chromosome number unchanged"
            detect: "distractor"
      - id: c9.cell.biomolecules
        name: Biomolecules in cells
        description: "Roles of carbohydrates, proteins, lipids and nucleic acids in cell structure and function."
        prerequisites: [c9.cell.organelles]
        misconceptions:
          - id: c9.cell.bio.fat_energy_only
            description: "Thinks lipids only store energy and have no role in membranes"
            detect: "distractor"

  - id: tissues
    name: Tissues
    chapter_number: 3
    unit: world_of_living
    board_weight_marks: 7
    board_weight_is_estimate: true
    default_question_types: [mcq, assertion_reason, case_based]
    concepts:
      - id: c9.tissue.levels_of_organisation
        name: Levels of organisation
        description: "Cell → tissue → organ → organ system → organism."
        prerequisites: [c9.cell.discovery]
        misconceptions:
          - id: c9.tissue.lvl.order
            description: "Puts organ before tissue in the hierarchy"
            detect: "distractor"
      - id: c9.tissue.meristematic
        name: Meristematic tissue
        description: "Apical (length), lateral (girth) and intercalary (at internodes/leaf base) meristems; actively dividing cells."
        prerequisites: [c9.tissue.levels_of_organisation]
        misconceptions:
          - id: c9.tissue.mer.intercalary_confusion
            description: "Thinks intercalary meristem causes growth in length at the tip"
            detect: "distractor"
          - id: c9.tissue.mer.lateral_length
            description: "Thinks lateral meristem increases length (it increases girth)"
            detect: "distractor"
          - id: c9.tissue.mer.permanent_divides
            description: "Thinks permanent tissue such as parenchyma drives growth by dividing"
            detect: "distractor"
      - id: c9.tissue.simple_permanent
        name: Simple permanent tissues
        description: "Parenchyma (storage, chlorenchyma, aerenchyma), collenchyma (flexibility) and sclerenchyma (strength, dead cells)."
        prerequisites: [c9.tissue.meristematic]
        misconceptions:
          - id: c9.tissue.sp.sclerenchyma_living
            description: "Thinks sclerenchyma cells are living"
            detect: "distractor"
          - id: c9.tissue.sp.collen_scleren_swap
            description: "Swaps collenchyma (flexible support) and sclerenchyma (rigid support)"
            detect: "distractor"
      - id: c9.tissue.complex_permanent
        name: Xylem and phloem
        description: "Xylem carries water and minerals upward; phloem carries food both ways; their component cells."
        prerequisites: [c9.tissue.simple_permanent]
        misconceptions:
          - id: c9.tissue.cp.xylem_food
            description: "Thinks xylem transports food"
            detect: "distractor"
          - id: c9.tissue.cp.phloem_one_way
            description: "Thinks phloem transports only downward"
            detect: "distractor"
      - id: c9.tissue.plant_vs_animal
        name: Plant and animal tissues compared
        description: "Plants have more dead supportive tissue and localised growth; animals have more living tissue."
        prerequisites: [c9.tissue.meristematic]
        misconceptions:
          - id: c9.tissue.pva.animals_meristem
            description: "Thinks animals have meristem-like growth regions"
            detect: "distractor"
      - id: c9.tissue.epithelial
        name: Epithelial tissue
        description: "Squamous, cuboidal, columnar, ciliated and stratified epithelium; covering and lining functions."
        prerequisites: [c9.tissue.levels_of_organisation]
        misconceptions:
          - id: c9.tissue.epi.type_location
            description: "Matches an epithelium type to the wrong location (e.g. columnar for skin)"
            detect: "distractor"
      - id: c9.tissue.connective
        name: Connective tissue
        description: "Blood, bone, cartilage, ligament, tendon, areolar and adipose tissue."
        prerequisites: [c9.tissue.levels_of_organisation]
        misconceptions:
          - id: c9.tissue.con.ligament_tendon
            description: "Swaps ligament (bone to bone) and tendon (muscle to bone)"
            detect: "distractor"
          - id: c9.tissue.con.blood_not_tissue
            description: "Doesn't count blood as a connective tissue"
            detect: "distractor"
      - id: c9.tissue.muscular
        name: Muscular tissue
        description: "Striated (voluntary), smooth (involuntary) and cardiac (involuntary, branched) muscle."
        prerequisites: [c9.tissue.levels_of_organisation]
        misconceptions:
          - id: c9.tissue.mus.cardiac_voluntary
            description: "Thinks cardiac muscle is voluntary"
            detect: "distractor"
      - id: c9.tissue.nervous
        name: Nervous tissue
        description: "Neurons with dendrites, cell body and axon carry impulses."
        prerequisites: [c9.tissue.levels_of_organisation]
        misconceptions:
          - id: c9.tissue.ner.direction
            description: "Thinks impulses travel from axon to dendrite within a neuron"
            detect: "distractor"
      - id: c9.tissue.musculoskeletal
        name: The musculoskeletal system and its care
        description: "Bones, joints, cartilage and muscles in movement; injuries, posture, nutrition, exercise and yoga."
        prerequisites: [c9.tissue.connective, c9.tissue.muscular]
        misconceptions:
          - id: c9.tissue.msk.joint_types
            description: "Confuses joint types (e.g. calls the knee a ball-and-socket joint)"
            detect: "distractor"

  - id: reproduction
    name: Reproduction
    chapter_number: 11
    unit: world_of_living
    board_weight_marks: 7
    board_weight_is_estimate: true
    default_question_types: [mcq, assertion_reason, case_based]
    concepts:
      - id: c9.repro.sexual_vs_asexual
        name: Sexual and asexual reproduction
        description: "Asexual: one parent, identical offspring. Sexual: two gametes, variation."
        prerequisites: [c9.cell.cell_division]
        misconceptions:
          - id: c9.repro.sva.asexual_variation
            description: "Thinks asexual reproduction produces much variation"
            detect: "distractor"
      - id: c9.repro.asexual_types
        name: Types of asexual reproduction
        description: "Fission (Amoeba), budding (yeast, Hydra), fragmentation (Spirogyra), spore formation (Rhizopus), vegetative propagation."
        prerequisites: [c9.repro.sexual_vs_asexual]
        misconceptions:
          - id: c9.repro.asx.example_swap
            description: "Matches an organism to the wrong method (e.g. yeast with fission)"
            detect: "distractor"
      - id: c9.repro.flower_parts
        name: Parts of a flower
        description: "Sepals, petals, stamens (anther, filament) and pistil (stigma, style, ovary); bisexual and unisexual flowers."
        prerequisites: [c9.repro.sexual_vs_asexual]
        misconceptions:
          - id: c9.repro.flw.stamen_female
            description: "Thinks the stamen is the female part"
            detect: "distractor"
      - id: c9.repro.pollination
        name: Pollination
        description: "Self- and cross-pollination; agents such as wind, water, insects and birds."
        prerequisites: [c9.repro.flower_parts]
        misconceptions:
          - id: c9.repro.pol.is_fertilisation
            description: "Thinks pollination and fertilisation are the same event"
            detect: "distractor"
      - id: c9.repro.seed_fruit
        name: Fertilisation, seed and fruit
        description: "After fertilisation the ovule becomes the seed and the ovary becomes the fruit."
        prerequisites: [c9.repro.pollination]
        misconceptions:
          - id: c9.repro.sf.ovary_seed
            description: "Thinks the ovary becomes the seed (or the ovule the fruit)"
            detect: "distractor"
      - id: c9.repro.seed_dispersal
        name: Seed dispersal
        description: "Dispersal by wind, water, animals and explosion, and why it matters."
        prerequisites: [c9.repro.seed_fruit]
        misconceptions:
          - id: c9.repro.disp.feature_agent
            description: "Matches a seed feature to the wrong agent (winged seeds with animals)"
            detect: "distractor"
      - id: c9.repro.human_male
        name: Human male reproductive system
        description: "Testes, sperm duct, accessory glands; production of sperm and hormones."
        prerequisites: [c9.repro.sexual_vs_asexual]
        misconceptions:
          - id: c9.repro.male.organ_function
            description: "Assigns sperm production to the wrong organ"
            detect: "distractor"
      - id: c9.repro.human_female
        name: Human female reproductive system
        description: "Ovaries, oviducts, uterus; production of eggs and hormones."
        prerequisites: [c9.repro.sexual_vs_asexual]
        misconceptions:
          - id: c9.repro.fem.fertilisation_site
            description: "Thinks fertilisation happens in the uterus (it happens in the oviduct)"
            detect: "distractor"
      - id: c9.repro.fertilisation_development
        name: Fertilisation and development of the embryo
        description: "Gametes fuse to form a zygote; implantation, placenta and pregnancy."
        prerequisites: [c9.repro.human_male, c9.repro.human_female]
        misconceptions:
          - id: c9.repro.dev.placenta_blood_mix
            description: "Thinks mother's and embryo's blood mix directly in the placenta"
            detect: "distractor"
      - id: c9.repro.menstrual_cycle
        name: Menstrual cycle
        description: "Monthly release of an egg and shedding of the uterine lining if fertilisation doesn't occur."
        prerequisites: [c9.repro.human_female]
        misconceptions:
          - id: c9.repro.mens.purpose
            description: "Doesn't connect menstruation with the uterine lining prepared for a fertilised egg"
            detect: "distractor"
      - id: c9.repro.health_contraception
        name: Reproductive health and birth control
        description: "Hygiene, sexually transmitted infections, and methods of birth control and their importance."
        prerequisites: [c9.repro.fertilisation_development]
        misconceptions:
          - id: c9.repro.health.method_protection
            description: "Thinks every contraceptive method also protects against infections"
            detect: "distractor"
      - id: c9.repro.variation
        name: Variation through sexual reproduction
        description: "Sexual reproduction combines genetic material from two parents, creating variation useful for survival."
        prerequisites: [c9.repro.sexual_vs_asexual, c9.cell.cell_division]
        misconceptions:
          - id: c9.repro.var.identical_siblings
            description: "Expects offspring of the same parents to be genetically identical"
            detect: "distractor"

  - id: diversity
    name: Diversity
    chapter_number: 12
    unit: world_of_living
    board_weight_marks: 6
    board_weight_is_estimate: true
    default_question_types: [mcq, assertion_reason, case_based]
    concepts:
      - id: c9.div.classification_basis
        name: Why and how we classify
        description: "Classifying by cell number, cellular organisation and mode of nutrition."
        prerequisites: [c9.cell.prokaryote_eukaryote]
        misconceptions:
          - id: c9.div.basis.habitat
            description: "Classifies organisms by habitat rather than structure and nutrition"
            detect: "distractor"
      - id: c9.div.five_kingdoms
        name: The five kingdoms
        description: "Monera, Protista, Fungi, Plantae and Animalia: key features and examples."
        prerequisites: [c9.div.classification_basis]
        misconceptions:
          - id: c9.div.five.fungi_plants
            description: "Classifies fungi as plants"
            detect: "distractor"
          - id: c9.div.five.monera_protista
            description: "Puts bacteria in Protista or Amoeba in Monera"
            detect: "distractor"
      - id: c9.div.plant_groups
        name: Major groups of plants
        description: "Thallophyta, Bryophyta, Pteridophyta, gymnosperms and angiosperms, with examples."
        prerequisites: [c9.div.five_kingdoms]
        misconceptions:
          - id: c9.div.plant.fern_seeds
            description: "Thinks ferns produce seeds"
            detect: "distractor"
          - id: c9.div.plant.gymno_fruit
            description: "Thinks gymnosperm seeds are enclosed in fruits"
            detect: "distractor"
      - id: c9.div.animal_groups
        name: Major groups of animals
        description: "Major phyla (Porifera to Chordata) and vertebrate classes with examples."
        prerequisites: [c9.div.five_kingdoms]
        misconceptions:
          - id: c9.div.animal.starfish_fish
            description: "Classifies a starfish as a fish"
            detect: "distractor"
          - id: c9.div.animal.bat_bird
            description: "Classifies a bat as a bird or a whale as a fish"
            detect: "distractor"
      - id: c9.div.binomial_nomenclature
        name: Binomial nomenclature
        description: "Genus name capitalised, species name lower case, both italicised (e.g. Homo sapiens)."
        prerequisites: [c9.div.five_kingdoms]
        misconceptions:
          - id: c9.div.bin.capital_species
            description: "Capitalises the species name"
            detect: "distractor"
      - id: c9.div.viruses
        name: Viruses as acellular entities
        description: "Viruses lack cells, reproduce only inside host cells, and are not placed in the five kingdoms."
        prerequisites: [c9.div.five_kingdoms]
        misconceptions:
          - id: c9.div.virus.bacteria
            description: "Thinks viruses are a kind of bacteria"
            detect: "distractor"
      - id: c9.div.ecological_roles
        name: Interactions and ecological roles
        description: "Roles such as producers and decomposers; interactions like lichens (alga + fungus)."
        prerequisites: [c9.div.five_kingdoms]
        misconceptions:
          - id: c9.div.eco.lichen_one
            description: "Thinks a lichen is a single organism"
            detect: "distractor"
      - id: c9.div.three_domains
        name: Three domains
        description: "Bacteria, Archaea and Eukarya: classification on a molecular basis."
        prerequisites: [c9.div.five_kingdoms]
        misconceptions:
          - id: c9.div.dom.archaea_bacteria
            description: "Thinks Archaea are the same as bacteria"
            detect: "distractor"

  # ===========================================================================
  # Unit II: Matter - Its Nature and Behaviour (25)
  # ===========================================================================
  - id: mixtures
    name: Exploring Mixtures and their Separation
    chapter_number: 5
    unit: matter
    board_weight_marks: 9
    board_weight_is_estimate: true
    default_question_types: [mcq, numeric, assertion_reason, case_based]
    concepts:
      - id: c9.mix.homo_hetero
        name: Homogeneous and heterogeneous mixtures
        description: "Uniform vs non-uniform composition, with everyday examples."
        prerequisites: []
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.hh.looks_uniform
            description: "Calls milk or blood homogeneous because they look uniform"
            detect: "distractor"
      - id: c9.mix.solution_suspension_colloid
        name: Solutions, suspensions and colloids
        description: "Particle size, transparency, filtration, stability and the Tyndall effect."
        prerequisites: [c9.mix.homo_hetero]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.ssc.tyndall_solution
            description: "Thinks true solutions show the Tyndall effect"
            detect: "distractor"
          - id: c9.mix.ssc.colloid_filterable
            description: "Thinks colloid particles can be removed by filter paper"
            detect: "distractor"
      - id: c9.mix.concentration_mass_mass
        name: Concentration — mass by mass %
        description: "Mass of solute ÷ mass of solution × 100."
        prerequisites: [c9.mix.homo_hetero]
        misconceptions:
          - id: c9.mix.conc.solvent_as_solution
            description: "Divides by the mass of solvent instead of the mass of solution"
            detect: "answer = solute/solvent*100"
          - id: c9.mix.conc.no_100
            description: "Forgets to multiply by 100"
            detect: "answer = correct/100"
      - id: c9.mix.concentration_mass_volume
        name: Concentration — mass by volume %
        description: "Mass of solute (g) ÷ volume of solution (mL) × 100."
        prerequisites: [c9.mix.concentration_mass_mass]
        misconceptions:
          - id: c9.mix.mv.litre_ml
            description: "Mixes litres and millilitres in the calculation"
            detect: "answer off by 1000"
      - id: c9.mix.concentration_volume_volume
        name: Concentration — volume by volume %
        description: "Volume of solute ÷ volume of solution × 100."
        prerequisites: [c9.mix.concentration_mass_mass]
        misconceptions:
          - id: c9.mix.vv.solvent_denominator
            description: "Uses the solvent's volume as the denominator"
            detect: "distractor"
      - id: c9.mix.solubility
        name: Solubility and temperature
        description: "Read solubility curves; solubility of most solids increases with temperature; saturated solutions."
        prerequisites: [c9.mix.solution_suspension_colloid]
        misconceptions:
          - id: c9.mix.sol.gases_increase
            description: "Thinks gas solubility increases with temperature"
            detect: "distractor"
          - id: c9.mix.sol.unlimited
            description: "Thinks any amount of solute can dissolve at a given temperature"
            detect: "distractor"
      - id: c9.mix.crystallisation
        name: Crystallisation
        description: "Obtaining pure crystals from a solution; why it beats evaporation to dryness."
        prerequisites: [c9.mix.solubility]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.cryst.evaporation_same
            description: "Thinks evaporating to dryness gives equally pure crystals"
            detect: "distractor"
      - id: c9.mix.distillation
        name: Distillation
        description: "Separating miscible liquids or a solvent from a solution by boiling and condensing."
        prerequisites: [c9.mix.homo_hetero]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.dist.higher_bp_first
            description: "Thinks the liquid with the higher boiling point distils over first"
            detect: "distractor"
      - id: c9.mix.chromatography
        name: Paper chromatography
        description: "Separating coloured components (e.g. ink dyes) by different solubility and movement on paper."
        prerequisites: [c9.mix.homo_hetero]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.chrom.solvent_below_line
            description: "Places the sample line below the solvent level"
            detect: "distractor"
      - id: c9.mix.sublimation
        name: Sublimation
        description: "Separating a sublimable solid (camphor, ammonium chloride, naphthalene) from a non-sublimable one."
        prerequisites: [c9.mix.homo_hetero]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.sub.salt_sublimes
            description: "Thinks common salt sublimes"
            detect: "distractor"
      - id: c9.mix.centrifugation_coagulation
        name: Centrifugation, coagulation and separating funnel
        description: "Centrifugation (cream from milk), coagulation with alum (muddy water), separating funnel (oil and water)."
        prerequisites: [c9.mix.solution_suspension_colloid]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.cent.lighter_bottom
            description: "Thinks lighter particles settle at the bottom on spinning"
            detect: "distractor"
      - id: c9.mix.choose_technique
        name: Choosing a separation technique
        description: "Pick the right technique from the physical properties of the components."
        prerequisites: [c9.mix.crystallisation, c9.mix.distillation, c9.mix.chromatography, c9.mix.sublimation, c9.mix.centrifugation_coagulation]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.mix.choose.filtration_solution
            description: "Chooses filtration to separate a dissolved solid"
            detect: "distractor"

  - id: structure_of_atom
    name: Structure of an Atom
    chapter_number: 8
    unit: matter
    board_weight_marks: 8
    board_weight_is_estimate: true
    verify: "Confirm chapter 8 is 'Structure of an Atom' and 9 is 'Atoms and Molecules' in the 2026-27 NCERT book."
    default_question_types: [mcq, numeric, assertion_reason, case_based]
    concepts:
      - id: c9.atom.subatomic_particles
        name: Subatomic particles
        description: "Electrons, protons and neutrons: charge, relative mass and location."
        prerequisites: []
        question_types_allowed: [mcq, assertion_reason]
        misconceptions:
          - id: c9.atom.sub.neutron_charge
            description: "Gives the neutron a charge"
            detect: "distractor"
          - id: c9.atom.sub.electron_mass
            description: "Thinks the electron's mass is similar to the proton's"
            detect: "distractor"
      - id: c9.atom.thomson
        name: Thomson's model
        description: "Positive sphere with embedded electrons; why it was replaced."
        prerequisites: [c9.atom.subatomic_particles]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.atom.thom.nucleus
            description: "Credits Thomson's model with a nucleus"
            detect: "distractor"
      - id: c9.atom.rutherford
        name: Rutherford's model
        description: "Alpha-scattering: most of the atom is empty space; a small dense positive nucleus; limitations."
        prerequisites: [c9.atom.thomson]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.atom.ruth.most_deflected
            description: "Thinks most alpha particles were deflected"
            detect: "distractor"
      - id: c9.atom.bohr
        name: Bohr's model
        description: "Electrons revolve in fixed energy levels (K, L, M, …) without radiating energy."
        prerequisites: [c9.atom.rutherford]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.atom.bohr.any_orbit
            description: "Thinks electrons can be in any orbit, not only fixed levels"
            detect: "distractor"
      - id: c9.atom.electron_distribution
        name: Electron distribution (first 18 elements)
        description: "2n² rule, filling K, L, M shells for elements 1–18."
        prerequisites: [c9.atom.bohr]
        misconceptions:
          - id: c9.atom.dist.eight_in_k
            description: "Puts more than 2 electrons in the K shell"
            detect: "distractor"
          - id: c9.atom.dist.skip_fill
            description: "Starts the next shell before the inner one is full"
            detect: "distractor"
      - id: c9.atom.valency
        name: Valency
        description: "Valency as combining capacity from the number of valence electrons (8 − valence electrons when more than 4)."
        prerequisites: [c9.atom.electron_distribution]
        misconceptions:
          - id: c9.atom.val.equals_valence
            description: "Takes valency as the number of valence electrons even when it is more than 4 (e.g. chlorine = 7)"
            detect: "answer = valence electrons"
      - id: c9.atom.mass_number
        name: Atomic number and mass number
        description: "Z = protons; A = protons + neutrons; count electrons, protons and neutrons."
        prerequisites: [c9.atom.subatomic_particles]
        misconceptions:
          - id: c9.atom.mass.adds
            description: "Adds atomic number and mass number to get neutrons"
            detect: "answer = A + Z"
          - id: c9.atom.mass.neutrons_equal_z
            description: "Assumes neutrons equal the atomic number"
            detect: "answer = Z"
      - id: c9.atom.isotopes_isobars
        name: Isotopes and isobars
        description: "Isotopes: same Z, different A. Isobars: same A, different Z. Uses of isotopes."
        prerequisites: [c9.atom.mass_number]
        misconceptions:
          - id: c9.atom.iso.swap
            description: "Swaps the definitions of isotopes and isobars"
            detect: "distractor"
          - id: c9.atom.iso.different_chemistry
            description: "Thinks isotopes have different chemical properties"
            detect: "distractor"
      - id: c9.atom.symbols
        name: Symbols of the first 18 elements
        description: "IUPAC symbols, including those from Latin names (Na, K)."
        prerequisites: []
        question_types_allowed: [mcq]
        misconceptions:
          - id: c9.atom.sym.first_letters
            description: "Guesses a symbol from the English name's first letters (So for sodium)"
            detect: "distractor"

  - id: atoms_molecules
    name: Atoms and Molecules
    chapter_number: 9
    unit: matter
    board_weight_marks: 8
    board_weight_is_estimate: true
    default_question_types: [mcq, numeric, assertion_reason, case_based]
    concepts:
      - id: c9.mol.conservation_of_mass
        name: Law of conservation of mass
        description: "Mass is neither created nor destroyed in a chemical reaction."
        prerequisites: []
        misconceptions:
          - id: c9.mol.com.gas_escapes
            description: "Thinks mass is lost when a gas is given off in a closed system"
            detect: "distractor"
      - id: c9.mol.constant_proportion
        name: Law of constant proportions
        description: "A compound always contains the same elements in the same proportion by mass."
        prerequisites: [c9.mol.conservation_of_mass]
        misconceptions:
          - id: c9.mol.cp.number_ratio
            description: "Confuses the mass ratio with the ratio of atoms"
            detect: "distractor"
      - id: c9.mol.dalton_theory
        name: Dalton's atomic theory
        description: "Postulates of Dalton's theory and which ones were later revised."
        prerequisites: [c9.mol.constant_proportion]
        question_types_allowed: [mcq, assertion_reason]
        misconceptions:
          - id: c9.mol.dalton.divisible
            description: "Doesn't recognise that 'atoms are indivisible' was later revised"
            detect: "distractor"
      - id: c9.mol.molecules
        name: Molecules of elements and compounds
        description: "Atomicity (monatomic, diatomic, polyatomic) and molecules of compounds."
        prerequisites: [c9.atom.symbols]
        misconceptions:
          - id: c9.mol.molec.element_one_atom
            description: "Thinks a molecule of an element always has one atom"
            detect: "distractor"
      - id: c9.mol.ions
        name: Ions
        description: "Cations and anions, charge on an ion, polyatomic ions."
        prerequisites: [c9.atom.valency]
        misconceptions:
          - id: c9.mol.ion.gain_positive
            description: "Thinks gaining electrons makes a positive ion"
            detect: "distractor"
      - id: c9.mol.ionic_covalent
        name: Ionic and covalent compounds
        description: "Formation by electron transfer vs sharing, and typical properties."
        prerequisites: [c9.mol.ions]
        misconceptions:
          - id: c9.mol.bond.ionic_molecules
            description: "Thinks ionic compounds exist as discrete molecules"
            detect: "distractor"
          - id: c9.mol.bond.covalent_conducts
            description: "Thinks covalent compounds conduct electricity when dissolved or molten"
            detect: "distractor"
      - id: c9.mol.chemical_formulae
        name: Writing chemical formulae
        description: "Use valencies (criss-cross) to write formulae of simple compounds, including polyatomic ions."
        prerequisites: [c9.mol.ions, c9.atom.valency]
        misconceptions:
          - id: c9.mol.form.no_criss_cross
            description: "Writes subscripts equal to own valency instead of crossing them"
            detect: "distractor"
          - id: c9.mol.form.no_brackets
            description: "Omits brackets around a polyatomic ion with a subscript (CaOH2)"
            detect: "distractor"
      - id: c9.mol.molecular_mass
        name: Molecular mass
        description: "Sum of atomic masses of the atoms in a molecule (in u)."
        prerequisites: [c9.mol.molecules]
        misconceptions:
          - id: c9.mol.mm.ignores_subscript
            description: "Ignores subscripts (counts one O in H₂O₂)"
            detect: "distractor"
          - id: c9.mol.mm.atomic_number
            description: "Adds atomic numbers instead of atomic masses"
            detect: "distractor"
      - id: c9.mol.formula_unit_mass
        name: Formula unit mass
        description: "Formula unit mass for ionic compounds such as NaCl or CaCl₂."
        prerequisites: [c9.mol.molecular_mass, c9.mol.ionic_covalent]
        misconceptions:
          - id: c9.mol.fum.called_molecular
            description: "Calls it molecular mass for an ionic compound"
            detect: "distractor"
      - id: c9.mol.electron_dot
        name: Electron dot structures
        description: "Draw and read electron dot structures of atoms and simple molecules."
        prerequisites: [c9.atom.electron_distribution]
        question_types_allowed: [mcq, case_based]
        misconceptions:
          - id: c9.mol.dot.all_electrons
            description: "Shows all electrons instead of only valence electrons"
            detect: "distractor"

  # ===========================================================================
  # Unit III: Motion, Force, Work and Sound (23)
  # ===========================================================================
  - id: motion
    name: Motion
    chapter_number: 4
    unit: motion_force
    board_weight_marks: 7
    board_weight_is_estimate: true
    default_question_types: [mcq, numeric, assertion_reason, case_based]
    concepts:
      - id: c9.motion.distance_displacement
        name: Distance and displacement
        description: "Distance is path length (scalar); displacement is change in position with direction (vector)."
        prerequisites: []
        misconceptions:
          - id: c9.motion.dd.same
            description: "Treats displacement as equal to distance on a round trip"
            detect: "answer = distance"
          - id: c9.motion.dd.negative_distance
            description: "Thinks distance can be negative"
            detect: "distractor"
      - id: c9.motion.speed_velocity
        name: Speed and velocity
        description: "Average speed = distance ÷ time; average velocity = displacement ÷ time; SI units."
        prerequisites: [c9.motion.distance_displacement]
        misconceptions:
          - id: c9.motion.sv.average_of_speeds
            description: "Averages two speeds instead of dividing total distance by total time"
            detect: "answer = (v1+v2)/2"
          - id: c9.motion.sv.kmh_ms
            description: "Converts km/h to m/s by dividing by 3.6 the wrong way (multiplies)"
            detect: "answer off by factor 3.6^2"
      - id: c9.motion.acceleration
        name: Acceleration
        description: "a = (v − u)/t; SI unit m/s²; negative acceleration (retardation)."
        prerequisites: [c9.motion.speed_velocity]
        misconceptions:
          - id: c9.motion.acc.multiplies
            description: "Multiplies the change in velocity by time instead of dividing"
            detect: "answer = (v-u)*t"
          - id: c9.motion.acc.final_only
            description: "Uses the final velocity alone instead of the change"
            detect: "answer = v/t"
      - id: c9.motion.position_time_graph
        name: Position-time graphs
        description: "Read position-time graphs; slope gives velocity; straight line = uniform velocity."
        prerequisites: [c9.motion.speed_velocity]
        misconceptions:
          - id: c9.motion.pt.slope_is_position
            description: "Reads the height of the graph as the velocity"
            detect: "distractor"
          - id: c9.motion.pt.flat_moving
            description: "Thinks a horizontal line means constant non-zero velocity"
            detect: "distractor"
      - id: c9.motion.velocity_time_graph
        name: Velocity-time graphs
        description: "Slope gives acceleration; area under the graph gives displacement."
        prerequisites: [c9.motion.acceleration, c9.motion.position_time_graph]
        misconceptions:
          - id: c9.motion.vt.area_is_acceleration
            description: "Takes the area under a v-t graph as acceleration"
            detect: "distractor"
          - id: c9.motion.vt.flat_stationary
            description: "Thinks a horizontal line on a v-t graph means the object is at rest"
            detect: "distractor"
      - id: c9.motion.kinematic_equations
        name: Equations of motion
        description: "v = u + at, s = ut + ½at², v² = u² + 2as (derived graphically) and their use."
        prerequisites: [c9.motion.velocity_time_graph]
        misconceptions:
          - id: c9.motion.kin.forgets_half
            description: "Uses s = ut + at² (forgets ½)"
            detect: "distractor"
          - id: c9.motion.kin.sign_retardation
            description: "Uses a positive a for a body that is slowing down"
            detect: "distractor"
      - id: c9.motion.uniform_circular
        name: Uniform circular motion
        description: "Speed constant but velocity changes; v = 2πr/T."
        prerequisites: [c9.motion.speed_velocity]
        misconceptions:
          - id: c9.motion.ucm.no_acceleration
            description: "Thinks uniform circular motion has no acceleration"
            detect: "distractor"
          - id: c9.motion.ucm.uses_diameter
            description: "Uses 2πd or πr for one revolution"
            detect: "distractor"

  - id: force_laws
    name: Force and Laws of Motion
    chapter_number: 6
    unit: motion_force
    board_weight_marks: 6
    board_weight_is_estimate: true
    default_question_types: [mcq, numeric, assertion_reason, case_based]
    concepts:
      - id: c9.force.balanced_unbalanced
        name: Balanced and unbalanced forces
        description: "Force has magnitude and direction; net force; balanced forces don't change motion."
        prerequisites: []
        misconceptions:
          - id: c9.force.bal.motion_needs_force
            description: "Thinks a moving object must have an unbalanced force on it"
            detect: "distractor"
          - id: c9.force.bal.net_adds_opposite
            description: "Adds opposite forces instead of subtracting to get the net force"
            detect: "answer = F1 + F2"
      - id: c9.force.friction
        name: Friction
        description: "Friction opposes relative motion; its effects, advantages and ways to change it."
        prerequisites: [c9.force.balanced_unbalanced]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.force.fric.direction
            description: "Thinks friction acts in the direction of motion"
            detect: "distractor"
      - id: c9.force.first_law
        name: Newton's first law and inertia
        description: "An object stays at rest or in uniform motion unless an unbalanced force acts; inertia depends on mass."
        prerequisites: [c9.force.balanced_unbalanced]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.force.first.inertia_speed
            description: "Thinks faster objects have more inertia"
            detect: "distractor"
      - id: c9.force.second_law
        name: Newton's second law
        description: "F = ma; SI unit newton; calculations with force, mass and acceleration."
        prerequisites: [c9.force.first_law, c9.motion.acceleration]
        misconceptions:
          - id: c9.force.second.divides
            description: "Computes F as m/a or a/m"
            detect: "distractor"
          - id: c9.force.second.grams
            description: "Uses mass in grams instead of kilograms"
            detect: "answer off by 1000"
      - id: c9.force.third_law
        name: Newton's third law
        description: "Action and reaction are equal, opposite and act on different bodies."
        prerequisites: [c9.force.first_law]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.force.third.cancel
            description: "Thinks action and reaction cancel because they act on the same body"
            detect: "distractor"
          - id: c9.force.third.bigger_object
            description: "Thinks the heavier object exerts the larger force in a collision"
            detect: "distractor"
      - id: c9.force.applications
        name: Newton's laws in everyday life
        description: "Seat belts, catching a ball, walking, rockets and similar situations."
        prerequisites: [c9.force.second_law, c9.force.third_law]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.force.app.wrong_law
            description: "Explains a situation with the wrong law (e.g. third law for a seat belt)"
            detect: "distractor"

  - id: work_energy
    name: Work, Energy and Simple Machines
    chapter_number: 7
    unit: motion_force
    board_weight_marks: 5
    board_weight_is_estimate: true
    default_question_types: [mcq, numeric, assertion_reason, case_based]
    concepts:
      - id: c9.work.work_done
        name: Work done by a constant force
        description: "W = F × s along the force; zero work when displacement is zero or perpendicular; joule."
        prerequisites: [c9.force.second_law]
        misconceptions:
          - id: c9.work.wd.effort_is_work
            description: "Thinks holding a heavy object still is doing work"
            detect: "distractor"
          - id: c9.work.wd.perpendicular
            description: "Counts work when the force is perpendicular to the displacement"
            detect: "distractor"
      - id: c9.work.forms_of_energy
        name: Forms of energy
        description: "Energy as capacity to do work; forms and their interconversion in daily life."
        prerequisites: []
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.work.forms.conversion_wrong
            description: "Gives the wrong energy conversion for a device (e.g. a fan as electrical → heat)"
            detect: "distractor"
      - id: c9.work.kinetic_energy
        name: Kinetic energy
        description: "KE = ½mv²."
        prerequisites: [c9.work.work_done]
        misconceptions:
          - id: c9.work.ke.no_square
            description: "Uses ½mv instead of ½mv²"
            detect: "distractor"
          - id: c9.work.ke.double_speed
            description: "Thinks doubling speed doubles kinetic energy"
            detect: "answer = 2x"
      - id: c9.work.potential_energy
        name: Gravitational potential energy
        description: "PE = mgh for an object raised to height h."
        prerequisites: [c9.work.work_done]
        misconceptions:
          - id: c9.work.pe.forgets_g
            description: "Leaves out g"
            detect: "answer = m*h"
      - id: c9.work.work_energy_theorem
        name: Work-energy theorem
        description: "Work done by the net force equals the change in kinetic energy."
        prerequisites: [c9.work.kinetic_energy]
        misconceptions:
          - id: c9.work.wet.final_ke
            description: "Equates work to the final KE rather than the change in KE"
            detect: "answer = final KE"
      - id: c9.work.conservation
        name: Conservation of mechanical energy
        description: "In free fall PE converts to KE with the total constant (ignoring air resistance)."
        prerequisites: [c9.work.kinetic_energy, c9.work.potential_energy]
        misconceptions:
          - id: c9.work.cons.forgot_sqrt
            description: "Finds v² and reports it as the speed"
            detect: "answer = correct^2"
          - id: c9.work.cons.energy_lost
            description: "Thinks total mechanical energy decreases during free fall without air resistance"
            detect: "distractor"
      - id: c9.work.power
        name: Power
        description: "P = W/t; watt, kilowatt."
        prerequisites: [c9.work.work_done]
        misconceptions:
          - id: c9.work.pow.multiplies
            description: "Computes power as work × time"
            detect: "answer = W*t"
      - id: c9.work.simple_machines
        name: Simple machines and mechanical advantage
        description: "Lever, pulley and inclined plane; MA = load ÷ effort."
        prerequisites: [c9.work.work_done]
        misconceptions:
          - id: c9.work.sm.inverted
            description: "Computes MA as effort ÷ load"
            detect: "answer = 1/correct"
          - id: c9.work.sm.saves_work
            description: "Thinks a simple machine reduces the work done"
            detect: "distractor"

  - id: sound
    name: Sound
    chapter_number: 10
    unit: motion_force
    board_weight_marks: 5
    board_weight_is_estimate: true
    default_question_types: [mcq, numeric, assertion_reason, case_based]
    concepts:
      - id: c9.sound.production
        name: Production of sound
        description: "Sound is produced by vibrating objects (strings, membranes, air columns)."
        prerequisites: []
        question_types_allowed: [mcq, assertion_reason]
        misconceptions:
          - id: c9.sound.prod.no_vibration
            description: "Thinks sound can be produced without vibration"
            detect: "distractor"
      - id: c9.sound.propagation
        name: Propagation as a longitudinal wave
        description: "Sound needs a medium and travels as compressions and rarefactions."
        prerequisites: [c9.sound.production]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.sound.prop.vacuum
            description: "Thinks sound can travel through vacuum"
            detect: "distractor"
          - id: c9.sound.prop.particles_travel
            description: "Thinks air particles travel from the source to the listener"
            detect: "distractor"
      - id: c9.sound.wave_characteristics
        name: Wavelength, frequency, time period, amplitude
        description: "Define and read these from a wave graph; T = 1/f."
        prerequisites: [c9.sound.propagation]
        misconceptions:
          - id: c9.sound.wc.amplitude_pitch
            description: "Links amplitude to pitch instead of loudness"
            detect: "distractor"
          - id: c9.sound.wc.period_frequency
            description: "Thinks time period and frequency are equal"
            detect: "distractor"
      - id: c9.sound.speed
        name: Speed of sound
        description: "v = fλ = λ/T; calculations."
        prerequisites: [c9.sound.wave_characteristics]
        misconceptions:
          - id: c9.sound.speed.divides
            description: "Computes v as f/λ or λ/f"
            detect: "distractor"
      - id: c9.sound.pitch_loudness
        name: Pitch, loudness and hearing
        description: "Pitch depends on frequency, loudness on amplitude; audible range 20 Hz – 20 kHz; infrasound and ultrasound."
        prerequisites: [c9.sound.wave_characteristics]
        misconceptions:
          - id: c9.sound.pl.range
            description: "Gets the human audible range wrong"
            detect: "distractor"
      - id: c9.sound.media
        name: Sound in different media
        description: "Sound is fastest in solids, slower in liquids, slowest in gases; effect of temperature."
        prerequisites: [c9.sound.propagation]
        question_types_allowed: [mcq, assertion_reason, case_based]
        misconceptions:
          - id: c9.sound.media.fastest_air
            description: "Thinks sound travels fastest in air"
            detect: "distractor"
      - id: c9.sound.echo_reverberation
        name: Echo and reverberation
        description: "Reflection of sound; echo distance from 2d = vt; minimum distance for an echo; reverberation and its control."
        prerequisites: [c9.sound.speed]
        misconceptions:
          - id: c9.sound.echo.no_double
            description: "Uses d = vt for an echo (forgets the sound goes there and back)"
            detect: "answer = 2*correct"
      - id: c9.sound.echolocation
        name: Echolocation and uses of reflection
        description: "Bats, dolphins and SONAR use reflected sound to locate objects."
        prerequisites: [c9.sound.echo_reverberation]
        misconceptions:
          - id: c9.sound.eloc.light
            description: "Thinks echolocation uses light"
            detect: "distractor"

  # ===========================================================================
  # Unit IV: Earth as a System (5)
  # ===========================================================================
  - id: earth_system
    name: "Earth as a System: Energy, Matter and Life"
    chapter_number: 13
    unit: earth_system
    board_weight_marks: 5
    default_question_types: [mcq, assertion_reason, case_based]
    concepts:
      - id: c9.earth.spheres
        name: Earth's interconnected spheres
        description: "Biosphere, geosphere, hydrosphere, cryosphere and atmosphere, and how they interact."
        prerequisites: []
        misconceptions:
          - id: c9.earth.sph.cryo_hydro
            description: "Confuses the cryosphere (ice) with the hydrosphere"
            detect: "distractor"
      - id: c9.earth.solar_radiation
        name: Solar radiation
        description: "Sunlight as electromagnetic radiation of different frequencies; the EM spectrum; speed of light."
        prerequisites: []
        misconceptions:
          - id: c9.earth.sol.needs_medium
            description: "Thinks sunlight needs a medium to reach Earth"
            detect: "distractor"
      - id: c9.earth.differential_heating
        name: Differential heating of the Earth
        description: "Latitude, tilt and surface reflectivity (albedo) cause uneven heating."
        prerequisites: [c9.earth.solar_radiation]
        misconceptions:
          - id: c9.earth.heat.distance_seasons
            description: "Thinks seasons are caused by changing distance from the Sun"
            detect: "distractor"
          - id: c9.earth.heat.ice_absorbs
            description: "Thinks ice absorbs more sunlight than dark soil"
            detect: "distractor"
      - id: c9.earth.winds_breezes
        name: Winds and breezes
        description: "Uneven heating causes winds; sea and land breezes; mountain and valley breezes."
        prerequisites: [c9.earth.differential_heating]
        misconceptions:
          - id: c9.earth.wind.sea_breeze_night
            description: "Thinks sea breezes blow at night"
            detect: "distractor"
      - id: c9.earth.water_cycle
        name: Water cycle
        description: "Evaporation, transpiration, condensation, precipitation and runoff."
        prerequisites: [c9.earth.spheres]
        misconceptions:
          - id: c9.earth.water.clouds_vapour
            description: "Thinks clouds are water vapour rather than droplets"
            detect: "distractor"
      - id: c9.earth.carbon_oxygen_cycle

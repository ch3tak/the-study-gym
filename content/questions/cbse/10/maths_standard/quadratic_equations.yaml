# Hand-written golden examples: one or more per question type. They are the
# reference shape for generate.py's few-shot prompt and the validator's fixtures.
questions:

  - id: q_quad_equal_roots_k_0001
    concepts: [quad.find_k_equal_roots, quad.discriminant]
    difficulty: 2
    type: mcq
    cbse_section: A
    marks: 1
    stem: "For what value of $k$ does $x^2 + kx + 9 = 0$ have equal roots?"
    options: ["$\\pm 6$", "$6$", "$\\pm 3$", "$9$"]
    answer: 0
    distractors:
      1: quad.disc.missed_negative_root
      2: quad.disc.forgot_4ac_factor
      3: quad.disc.confused_c_with_k
    hints:
      - "Equal roots means the discriminant is zero."
      - "Set $b^2 - 4ac = 0$ with $a = 1$, $b = k$, $c = 9$."
    solution_steps:
      - "Equal roots $\\Rightarrow D = b^2 - 4ac = 0$."
      - "$k^2 - 4(1)(9) = 0 \\Rightarrow k^2 = 36$."
      - "$k = \\pm 6$ (both signs work)."
    verification:
      sympy: "solve(k**2 - 4*1*9, k)"
      option_values: ["[-6, 6]", "6", "[-3, 3]", "9"]
    status: review

  - id: q_quad_factorise_solve_0001
    concepts: [quad.factorisation]
    difficulty: 2
    type: numeric
    cbse_section: B
    marks: 2
    stem: "Find the roots of $2x^2 - 7x + 3 = 0$ by factorisation."
    answers: ["3", "1/2"]
    wrong_answers:
      "-3": quad.fact.sign_flip
      "-1/2": quad.fact.sign_flip
    hints:
      - "Find two numbers whose product is $2 \\times 3 = 6$ and whose sum is $-7$."
      - "Split: $2x^2 - 6x - x + 3 = 0$."
    solution_steps:
      - "$2x^2 - 6x - x + 3 = 0$"
      - "$2x(x - 3) - 1(x - 3) = 0$"
      - "$(2x - 1)(x - 3) = 0$"
      - "$x = \\frac{1}{2}$ or $x = 3$"
    verification:
      sympy: "solve(2*x**2 - 7*x + 3, x)"
    status: review

  - id: q_quad_factorise_expr_0001
    concepts: [quad.factorisation]
    difficulty: 2
    type: expression
    cbse_section: A
    marks: 1
    stem: "Factorise $6x^2 + x - 2$."
    answer: "(2*x - 1)*(3*x + 2)"
    variables: [x]
    form: factored
    wrong_answers:
      "(2*x + 1)*(3*x - 2)": quad.fact.sign_flip
    hints:
      - "Look for two numbers with product $6 \\times (-2) = -12$ and sum $1$."
      - "They are $4$ and $-3$: $6x^2 + 4x - 3x - 2$."
    solution_steps:
      - "$6x^2 + 4x - 3x - 2$"
      - "$2x(3x + 2) - 1(3x + 2)$"
      - "$(2x - 1)(3x + 2)$"
    verification:
      sympy: "factor(6*x**2 + x - 2)"
    status: review

  - id: q_quad_discriminant_0001
    concepts: [quad.discriminant]
    difficulty: 1
    type: numeric
    cbse_section: A
    marks: 1
    stem: "Find the discriminant of $3x^2 - 5x + 2 = 0$."
    answers: ["1"]
    wrong_answers:
      "19": quad.disc.forgot_4ac_factor
      "49": quad.disc.sign_c
    hints:
      - "$D = b^2 - 4ac$. Read off $a$, $b$ and $c$ with their signs."
    solution_steps:
      - "$a = 3$, $b = -5$, $c = 2$"
      - "$D = (-5)^2 - 4(3)(2) = 25 - 24 = 1$"
    verification:
      sympy: "(-5)**2 - 4*3*2"
    status: review

  - id: q_quad_nature_ar_0001
    concepts: [quad.nature_of_roots]
    difficulty: 1
    type: assertion_reason
    cbse_section: A
    marks: 1
    stem: "Read the Assertion (A) and Reason (R) and choose the correct option."
    assertion: "The equation $x^2 + x + 1 = 0$ has no real roots."
    reason: "A quadratic equation has no real roots when its discriminant is negative."
    answer: a
    solution_steps:
      - "$D = 1^2 - 4(1)(1) = -3 < 0$, so A is true."
      - "R is the rule that decides this, so R is true and explains A."
    status: review

  - id: q_quad_garden_case_0001
    concepts: [quad.word_geometry, quad.form_from_situation]
    difficulty: 2
    type: case_based
    cbse_section: E
    marks: 4
    stem: >-
      Riya is planning a rectangular vegetable garden behind her school. The
      garden must be 3 m longer than it is wide, and the school has given her
      exactly $180\ \text{m}^2$ of land. Let the width of the garden be $x$ metres.
    parts:
      - type: mcq
        concepts: [quad.form_from_situation, quad.standard_form]
        marks: 1
        stem: "Which equation represents the situation?"
        options: ["$x^2 + 3x - 180 = 0$", "$x^2 - 3x - 180 = 0$", "$x^2 + 3x + 180 = 0$", "$2x + 3 = 180$"]
        answer: 0
        distractors:
          1: generic.misread_question
          2: quad.sf.sign_on_move
          3: generic.misread_question
        solution_steps:
          - "Area $= x(x + 3) = 180$, so $x^2 + 3x - 180 = 0$."
        verification:
          sympy: "expand(x*(x + 3) - 180)"
          option_values: ["x**2 + 3*x - 180", "x**2 - 3*x - 180", "x**2 + 3*x + 180", "2*x + 3 - 180"]
      - type: numeric
        marks: 1
        stem: "What is the width of the garden, in metres?"
        answers: ["12"]
        wrong_answers:
          "-15": quad.wg.negative_length
        solution_steps:
          - "$x^2 + 3x - 180 = (x + 15)(x - 12) = 0$"
          - "Width can't be negative, so $x = 12$ m."
        verification:
          sympy: "positive_roots(x**2 + 3*x - 180, x)"
      - type: numeric
        marks: 2
        stem: "Riya wants to fence the whole garden. How many metres of fencing does she need?"
        answers: ["54"]
        wrong_answers:
          "27": generic.misread_question
          "180": generic.misread_question
        solution_steps:
          - "Length $= 12 + 3 = 15$ m."
          - "Perimeter $= 2(12 + 15) = 54$ m."
        verification:
          sympy: "2*(2*positive_roots(x**2 + 3*x - 180, x)[0] + 3)"
    status: review

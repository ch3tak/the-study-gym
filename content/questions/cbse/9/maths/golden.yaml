# Hand-written golden examples for Class 9 Maths: one or more per question type.
# Reference shape for generate.py's few-shot prompt and validator fixtures.
questions:

  - id: q_c9_gp_nth_term_0001
    concepts: [c9.seq.gp_nth_term]
    difficulty: 2
    type: mcq
    cbse_section: A
    marks: 1
    stem: "What is the 8th term of the geometric progression $3, 6, 12, 24, \\ldots$?"
    options: ["$384$", "$768$", "$48$", "$279936$"]
    answer: 0
    distractors:
      1: c9.seq.gp.power_n
      2: c9.seq.gp.linear_thinking
      3: c9.seq.gp.multiplies_then_powers
    hints:
      - "Find the first term $a$ and the common ratio $r$."
      - "The $n$th term of a GP is $a \\cdot r^{n-1}$."
    solution_steps:
      - "$a = 3$, $r = \\frac{6}{3} = 2$"
      - "$a_8 = 3 \\times 2^{7} = 3 \\times 128 = 384$"
    verification:
      sympy: "3*2**(8 - 1)"
      option_values: ["384", "768", "48", "6**7"]
    status: review

  - id: q_c9_herons_formula_0001
    concepts: [c9.area.herons_formula]
    difficulty: 2
    type: numeric
    cbse_section: B
    marks: 2
    stem: "A triangular garden has sides $13$ m, $14$ m and $15$ m. Find its area in square metres."
    answers: ["84"]
    unit: "m^2"
    wrong_answers:
      "7056": c9.area.heron.no_sqrt
    hints:
      - "Start with the semi-perimeter $s = \\frac{a + b + c}{2}$."
      - "Area $= \\sqrt{s(s-a)(s-b)(s-c)}$."
    solution_steps:
      - "$s = \\frac{13 + 14 + 15}{2} = 21$"
      - "Area $= \\sqrt{21 \\times 8 \\times 7 \\times 6} = \\sqrt{7056}$"
      - "Area $= 84\\ \\text{m}^2$"
    verification:
      sympy: "sqrt(21*(21 - 13)*(21 - 14)*(21 - 15))"
    status: review

  - id: q_c9_factorise_identity_0001
    concepts: [c9.iden.factorise_identities]
    difficulty: 1
    type: expression
    cbse_section: A
    marks: 1
    stem: "Factorise $9x^2 - 12x + 4$."
    answer: "(3*x - 2)**2"
    variables: [x]
    form: factored
    wrong_answers:
      "(3*x + 2)**2": c9.iden.sign_error
    hints:
      - "Check whether it matches $a^2 - 2ab + b^2$."
    solution_steps:
      - "$9x^2 = (3x)^2$, $4 = 2^2$ and $12x = 2 \\times 3x \\times 2$"
      - "$9x^2 - 12x + 4 = (3x - 2)^2$"
    verification:
      sympy: "factor(9*x**2 - 12*x + 4)"
    status: review

  - id: q_c9_semicircle_ar_0001
    concepts: [c9.circ.same_segment]
    difficulty: 1
    type: assertion_reason
    cbse_section: A
    marks: 1
    stem: "Read the Assertion (A) and Reason (R) and choose the correct option."
    assertion: "The angle in a semicircle is a right angle."
    reason: "The angle subtended by an arc at the centre is double the angle it subtends at any point on the remaining part of the circle."
    answer: a
    solution_steps:
      - "A semicircle's arc subtends $180^\\circ$ at the centre."
      - "So it subtends $\\frac{180^\\circ}{2} = 90^\\circ$ at the circle: A is true, and R explains it."
    status: review

  - id: q_c9_sum_natural_0001
    concepts: [c9.seq.sum_natural]
    difficulty: 1
    type: numeric
    cbse_section: A
    marks: 1
    stem: "Find the sum $1 + 2 + 3 + \\cdots + 50$."
    answers: ["1275"]
    wrong_answers:
      "2550": c9.seq.sum.forgot_half
      "1225": c9.seq.sum.n_minus_1
    hints:
      - "Use $\\frac{n(n+1)}{2}$."
    solution_steps:
      - "$\\frac{50 \\times 51}{2} = 1275$"
    verification:
      sympy: "50*51/2"
    status: review

  - id: q_c9_tower_hanoi_0001
    concepts: [c9.seq.tower_of_hanoi]
    difficulty: 2
    type: numeric
    cbse_section: B
    marks: 2
    stem: "What is the minimum number of moves needed to solve the Tower of Hanoi puzzle with $5$ discs?"
    answers: ["31"]
    wrong_answers:
      "32": c9.seq.hanoi.power_only
      "9": c9.seq.hanoi.linear
    hints:
      - "With 1, 2, 3 discs the minimum moves are 1, 3, 7. Spot the pattern."
      - "$M_n = 2M_{n-1} + 1$, which gives $M_n = 2^n - 1$."
    solution_steps:
      - "$M_n = 2^n - 1$"
      - "$M_5 = 2^5 - 1 = 31$"
    verification:
      sympy: "2**5 - 1"
    status: review

  - id: q_c9_two_coins_case_0001
    concepts: [c9.prob.tree_tables, c9.prob.theoretical]
    difficulty: 2
    type: case_based
    cbse_section: E
    marks: 4
    stem: >-
      Before a cricket match, the two captains decide who bats first by tossing a
      fair coin twice. Aarav records each result in a tree diagram: first toss,
      then second toss.
    parts:
      - type: mcq
        marks: 1
        stem: "How many outcomes are there in the sample space?"
        options: ["$4$", "$3$", "$2$", "$8$"]
        answer: 0
        distractors:
          1: c9.prob.tree.unordered
          2: generic.misread_question
          3: generic.arithmetic_slip
        solution_steps:
          - "The outcomes are HH, HT, TH, TT: $2 \\times 2 = 4$."
        verification:
          sympy: "2**2"
          option_values: ["4", "3", "2", "8"]
      - type: numeric
        marks: 1
        stem: "What is the probability of getting exactly one head?"
        answers: ["1/2"]
        wrong_answers:
          "1/3": c9.prob.tree.unordered
        solution_steps:
          - "Favourable: HT, TH. $P = \\frac{2}{4} = \\frac{1}{2}$"
        verification:
          sympy: "Rational(2, 4)"
      - type: numeric
        marks: 2
        stem: "What is the probability of getting at least one head?"
        answers: ["3/4"]
        wrong_answers:
          "1/4": c9.prob.theo.complement
        solution_steps:
          - "Only TT has no head, so $P(\\text{no head}) = \\frac{1}{4}$."
          - "$P(\\text{at least one head}) = 1 - \\frac{1}{4} = \\frac{3}{4}$"
        verification:
          sympy: "1 - Rational(1, 4)"
    status: review

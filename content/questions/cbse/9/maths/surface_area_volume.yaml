    marks: 3
    level: 57
    stage: MASTERY
    purpose: [HIGHER_ORDER, WORD_PROBLEM]
    stem: "A hemispherical bowl has a rim of diameter $14$ cm. Find its capacity in litres. (Use $\\pi = \\frac{22}{7}$; give your answer in terms of $\\pi$ is not needed — use $\\pi=\\frac{22}{7}$ throughout, and give the answer rounded to 3 decimal places.)"
    answers: ["0.719"]
    tolerance: 0.001
    unit: "L"
    wrong_answers:
      "1.437": generic.misread_question
    hints:
      - "The rim's diameter, not radius, is given — halve it first."
      - "A bowl is a hemisphere: volume $= \\frac{2}{3}\\pi r^3$, then convert $\\text{cm}^3$ to litres."
    solution_steps:
      - "Radius $= \\frac{14}{2} = 7\\ \\text{cm}$"
      - "Volume $= \\frac{2}{3} \\times \\frac{22}{7} \\times 7^3 = \\frac{2156}{3} \\approx 718.67\\ \\text{cm}^3$"
      - "Capacity $= \\frac{718.67}{1000} \\approx 0.719\\ \\text{L}$"
    verification:
      sympy: "(Rational(2,3)*Rational(22,7)*7**3)/1000"
      tolerance: 0.001
    why_after_previous: "Introduces a novel framing (diameter instead of radius given directly) to test whether the r-vs-d conversion and the cm³-to-L conversion both survive under an unfamiliar presentation, not just familiar wording."
    prepares_for: "L58's scaling-across-solids reasoning question."
    status: review

  - id: q_c9_sav_l058
    concepts: [c9.sav.scaling, c9.sav.sphere_hemisphere, c9.sav.cuboid_cube]
    difficulty: 3
    type: mcq

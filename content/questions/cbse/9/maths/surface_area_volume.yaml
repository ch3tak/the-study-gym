    stage: MASTERY
    purpose: [HIGHER_ORDER, REASONING]
    stem: "A sphere and a cube have the same volume. If the cube's side is doubled (so its volume becomes $8$ times as large), by what factor must the sphere's radius change so the two solids' volumes stay equal?"
    options: ["$2$", "$8$", "$4$", "$\\sqrt{2}$"]
    answer: 0
    distractors:
      1: generic.misread_question
      2: generic.misread_question
      3: generic.misread_question
    hints:
      - "Both a cube's and a sphere's volume scale by (linear scale factor)$^3$. If the volume must scale by $8$, what linear factor cubes to give $8$?"
    solution_steps:
      - "Both volumes are cubic in their linear dimension, so if the new volume is $8$ times the old, the sphere's radius must scale by $\\sqrt[3]{8} = 2$ — the same factor as the cube's side."
      - "This is the same cube-root relationship used in reverse in L31, now applied to compare two different solids."
    verification:
      sympy: "8**Rational(1,3)"
      option_values: ["8**Rational(1,3)", "8", "8**Rational(1,2)", "sqrt(2)"]

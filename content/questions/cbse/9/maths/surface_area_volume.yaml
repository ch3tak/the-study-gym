# Surface Areas and Volumes (CBSE Class 9) — the 62-level mission.
#
# Sequenced content for the Mission Blueprint proof-of-concept (docs/curriculum
# doc "Mission Blueprint: Surface Areas and Volumes"). Levels 1-62 map 1:1 to
# that blueprint's §6 table. `level`/`stage`/`purpose`/`why_after_previous`/
# `prepares_for` are mission-design metadata (optional fields on top of the
# normal question schema) that a future levels/skill-path UI can consume;
# nothing here changes how existing chapters are graded or stored.
#
# Question-format notes: the pipeline only supports mcq/numeric/expression/
# assertion_reason/case_based, and this chapter's concepts only allow
# mcq/numeric/case_based (content/syllabus/cbse/9/maths.yaml). Blueprint
# formats without a direct match (True/False, Fill-in-blank, Select-the-step,
# Identify-the-error, Match) are rephrased as mcq/numeric/case_based
# equivalents that preserve the same skill and misconception target.
questions:

  # ---------------------------------------------------------------------
  # Stage 1 — Foundation (L1-L8): cuboid/cube vocabulary and mechanics.
  # ---------------------------------------------------------------------

  - id: q_c9_sav_l001
    concepts: [c9.sav.cuboid_cube]
    difficulty: 1
    type: mcq
    marks: 1
    level: 1
    stage: FOUNDATION
    purpose: [INTRODUCTION, RECOGNITION]
    stem: "A cuboid-shaped box has length 8 cm, breadth 5 cm and height 3 cm, as shown: the longest edge is length, the shorter base edge is breadth, and the vertical edge is height. Which edge is the breadth?"
    options: ["The $5$ cm edge", "The $8$ cm edge", "The $3$ cm edge", "There is no breadth edge"]
    answer: 0
    distractors:
      1: generic.misread_question
      2: c9.sav.cub.lateral_vs_total
      3: generic.misread_question
    hints:
      - "Length is the longest base edge, breadth is the shorter base edge, and height is vertical."
    solution_steps:
      - "By convention, length $= 8$ cm (longest base edge), breadth $= 5$ cm (shorter base edge), height $= 3$ cm (vertical edge)."
      - "So the breadth is the $5$ cm edge."
    why_after_previous: "First level of the mission: establishes the l/b/h labelling every later formula depends on."
    prepares_for: "L2's formula fill-in and every cuboid computation from L3 onward."
    status: review

  - id: q_c9_sav_l002
    concepts: [c9.sav.cuboid_cube]
    difficulty: 1
    type: numeric
    marks: 1
    level: 2
    stage: FOUNDATION
    purpose: [INTRODUCTION, RECALL]
    stem: "A cuboid has length $l$, breadth $b$ and height $h$. Its total surface area is $2(lb + bh + hl)$. If $l = 1$, $b = 1$ and $h = 1$ (a unit cube), what is its total surface area?"
    answers: ["6"]
    unit: "cm^2"
    wrong_answers:
      "3": c9.sav.cub.forgets_2
      "1": generic.arithmetic_slip
    hints:
      - "Substitute $l = b = h = 1$ into $2(lb + bh + hl)$."
      - "$lb + bh + hl = 1 + 1 + 1 = 3$, then double it."
    solution_steps:
      - "$2(1 \\times 1 + 1 \\times 1 + 1 \\times 1) = 2(3) = 6$"
    verification:
      sympy: "2*(1*1+1*1+1*1)"
    why_after_previous: "L1 identified the edges by name; L2 puts them straight into the formula's shape with the simplest possible numbers."
    prepares_for: "L3, the same formula with realistic numbers."
    status: review

  - id: q_c9_sav_l003
    concepts: [c9.sav.cuboid_cube]
    difficulty: 1
    type: numeric
    marks: 1
    level: 3
    stage: FOUNDATION
    purpose: [BASIC_APPLICATION]
    stem: "A cuboid has length $8$ cm, breadth $5$ cm and height $3$ cm. Find its total surface area."
    answers: ["158"]
    unit: "cm^2"
    wrong_answers:
      "79": c9.sav.cub.forgets_2
      "120": generic.arithmetic_slip
    hints:
      - "Total surface area $= 2(lb + bh + hl)$."
      - "$lb = 40$, $bh = 15$, $hl = 24$."
    solution_steps:
      - "$lb + bh + hl = 8(5) + 5(3) + 3(8) = 40 + 15 + 24 = 79$"
      - "TSA $= 2 \\times 79 = 158\\ \\text{cm}^2$"
    verification:
      sympy: "2*(8*5+5*3+3*8)"
    why_after_previous: "L2 used a trivial unit cube; L3 is the same formula with the realistic numbers the rest of the mission will build on."
    prepares_for: "L4's MCQ version of this exact computation, testing whether the factor of 2 survives."
    status: review

  - id: q_c9_sav_l004
    concepts: [c9.sav.cuboid_cube]
    difficulty: 1
    type: mcq
    marks: 1
    level: 4
    stage: FOUNDATION
    purpose: [MISCONCEPTION_CHECK]
    stem: "A cuboid has length $8$ cm, breadth $5$ cm and height $3$ cm. What is its total surface area?"
    options: ["$158\\text{ cm}^2$", "$79\\text{ cm}^2$", "$120\\text{ cm}^2$", "$79\\text{ cm}^3$"]
    answer: 0
    distractors:
      1: c9.sav.cub.forgets_2
      2: generic.arithmetic_slip
      3: c9.sav.units.area_as_volume
    hints:
      - "You already found $lb + bh + hl$ in L3. What does the total surface area formula do with that sum?"
      - "Total surface area $= 2(lb + bh + hl)$. Don't forget the $2$."
    solution_steps:
      - "$lb + bh + hl = 40 + 15 + 24 = 79$."
      - "TSA $= 2 \\times 79 = 158\\ \\text{cm}^2$. Stopping at $79$ only counts each face pair once instead of twice."
    verification:
      sympy: "2*(8*5+5*3+3*8)"
      option_values: ["2*(8*5+5*3+3*8)", "8*5+5*3+3*8", "8*5*3", "8*5+5*3+3*8"]
    why_after_previous: "L3 asked for the same TSA with no trap; L4 immediately re-tests the identical numbers as an MCQ so a learner who silently forgot the factor of 2 is caught right away."
    prepares_for: "L6's single-variable cube version, and every later surface-area question where 'forgot the 2' is the error to guard against."
    status: review

  - id: q_c9_sav_l005
    concepts: [c9.sav.cuboid_cube]
    difficulty: 1
    type: mcq
    marks: 1
    level: 5
    stage: FOUNDATION
    purpose: [CONCEPTUAL_UNDERSTANDING]
    stem: "Which statement correctly describes a cube?"
    options: ["A cube is a cuboid where $l = b = h$", "A cube is a cuboid with no height", "A cube has $8$ faces", "A cube is only defined by its volume, not its surface area"]
    answer: 0
    distractors:
      1: generic.misread_question
      2: generic.misread_question
      3: generic.misread_question
    hints:
      - "Think about what makes a cube special among cuboids: is it a different shape, or a cuboid with equal edges?"
    solution_steps:
      - "A cube is simply a cuboid whose length, breadth and height are all equal: $l = b = h$."
      - "Every cube formula (TSA $= 6a^2$, volume $= a^3$) is the general cuboid formula with $l = b = h = a$ substituted in."
    why_after_previous: "Confirms the mental model — a cube is a special case, not a new shape — before L6 specialises the formulas to one variable."
    prepares_for: "L6, which applies this specialisation directly."
    status: review

  - id: q_c9_sav_l006
    concepts: [c9.sav.cuboid_cube]
    difficulty: 1
    type: numeric
    marks: 1
    level: 6
    stage: FOUNDATION
    purpose: [VARIATION]
    stem: "A cube has side $4$ cm. Find its total surface area."
    answers: ["96"]
    unit: "cm^2"
    wrong_answers:
      "48": c9.sav.cub.forgets_2
      "64": generic.arithmetic_slip
    hints:
      - "For a cube, $l = b = h = a$, so TSA $= 2(a^2+a^2+a^2) = 6a^2$."
    solution_steps:
      - "TSA $= 6a^2 = 6 \\times 4^2 = 6 \\times 16 = 96\\ \\text{cm}^2$"
    verification:
      sympy: "6*4**2"
    why_after_previous: "L5 confirmed a cube is $l=b=h$; L6 is the single-variable case of L3's formula, using that substitution directly."
    prepares_for: "L7's volume question on the same cuboid, and L8's checkpoint that combines both."
    status: review

  - id: q_c9_sav_l007
    concepts: [c9.sav.cuboid_cube]
    difficulty: 1
    type: numeric
    marks: 1
    level: 7
    stage: FOUNDATION
    purpose: [BASIC_APPLICATION]
    stem: "A cuboid has length $8$ cm, breadth $5$ cm and height $3$ cm (the same cuboid as before). Find its volume."
    answers: ["120"]
    unit: "cm^3"
    wrong_answers:
      "158": generic.misread_question
      "16": generic.arithmetic_slip
    hints:
      - "Volume of a cuboid $= l \\times b \\times h$."
    solution_steps:
      - "Volume $= 8 \\times 5 \\times 3 = 120\\ \\text{cm}^3$"
    verification:
      sympy: "8*5*3"
    why_after_previous: "Same figure as L3-L4, second question: reinforces that surface area and volume are two different, separately-computed quantities for one solid."
    prepares_for: "L8, the Foundation checkpoint combining both TSA and volume for a cube."
    status: review

  - id: q_c9_sav_l008
    concepts: [c9.sav.cuboid_cube]
    difficulty: 2
    type: case_based
    marks: 2
    level: 8
    stage: FOUNDATION
    purpose: [PROCEDURAL_FLUENCY, REVIEW]
    stem: "Foundation checkpoint. A cube has side $6$ cm. Answer both parts about it."
    parts:
      - type: numeric
        marks: 1
        stem: "Find the cube's volume."
        answers: ["216"]
        unit: "cm^3"
        solution_steps:
          - "Volume $= a^3 = 6^3 = 216\\ \\text{cm}^3$"
        verification:
          sympy: "6**3"
      - type: numeric
        marks: 1
        stem: "Find the cube's total surface area."
        answers: ["216"]
        unit: "cm^2"
        solution_steps:
          - "TSA $= 6a^2 = 6 \\times 6^2 = 216\\ \\text{cm}^2$"
        verification:
          sympy: "6*6**2"
    why_after_previous: "Closes Foundation by requiring both formulas, in order, for the same solid without being told which to use first — the checkpoint the blueprint's §5 describes."
    prepares_for: "Stage 2 (cylinder), which reuses this same TSA-then-volume rhythm on a curved solid."
    status: review

  # ---------------------------------------------------------------------
  # Stage 2 — Guided Practice (L9-L19): cylinder, cone, pyramid.
  # ---------------------------------------------------------------------

  - id: q_c9_sav_l009
    concepts: [c9.sav.cylinder]
    difficulty: 1
    type: mcq
    marks: 1
    level: 9
    stage: GUIDED_PRACTICE
    purpose: [INTRODUCTION, RECOGNITION]
    stem: "A right circular cylinder is labelled with $r$ (the radius of its circular base) and $h$ (its vertical height). If a cylinder is $10$ cm tall and its circular base has radius $7$ cm, what is $h$?"
    options: ["$10$ cm", "$7$ cm", "$17$ cm", "$70$ cm"]
    answer: 0
    distractors:
      1: generic.misread_question
      2: generic.arithmetic_slip
      3: generic.arithmetic_slip
    hints:
      - "$h$ is the height (how tall it stands); $r$ is the base radius (how wide the circle is)."
    solution_steps:
      - "The height $h$ is explicitly given as $10$ cm; the radius $r = 7$ cm is a separate measurement."
    why_after_previous: "First cylinder level: establishes $r$/$h$ labelling the way L1 established $l$/$b$/$h$ for the cuboid."
    prepares_for: "L10's formula fill-in, which uses this same $r$/$h$ notation."
    status: review

  - id: q_c9_sav_l010
    concepts: [c9.sav.cylinder]
    difficulty: 1
    type: numeric
    marks: 1
    level: 10
    stage: GUIDED_PRACTICE
    purpose: [RECALL]
    stem: "The curved surface area of a cylinder is $2\\pi r h$. If $r = 1$ and $h = 1$, what is the curved surface area (leave your answer as a multiple of $\\pi$; enter just the coefficient of $\\pi$)?"
    answers: ["2"]
    unit: "none"
    wrong_answers:
      "1": c9.sav.cyl.curved_for_total
    hints:
      - "Substitute $r = 1, h = 1$ into $2\\pi r h$ and read off the coefficient of $\\pi$."
    solution_steps:
      - "$2\\pi(1)(1) = 2\\pi$, so the coefficient is $2$."
    verification:
      sympy: "2*1*1"
    why_after_previous: "L9 named the parts; L10 puts them straight into the CSA formula's shape, mirroring L2's role for the cuboid."
    prepares_for: "L11, the same formula with realistic numbers."
    status: review

  - id: q_c9_sav_l011
    concepts: [c9.sav.cylinder]
    difficulty: 1
    type: numeric
    marks: 1
    level: 11
    stage: GUIDED_PRACTICE
    purpose: [BASIC_APPLICATION]
    stem: "A cylinder has radius $7$ cm and height $10$ cm. Find its curved surface area. (Use $\\pi = \\frac{22}{7}$.)"
    answers: ["440"]
    unit: "cm^2"
    wrong_answers:
      "220": generic.arithmetic_slip
      "1540": generic.misread_question
    hints:
      - "Curved surface area $= 2\\pi r h$."
      - "$\\pi = \\frac{22}{7}$ is chosen to cancel neatly with $r = 7$."
    solution_steps:
      - "CSA $= 2 \\times \\frac{22}{7} \\times 7 \\times 10 = 2 \\times 22 \\times 10 = 440\\ \\text{cm}^2$"
    verification:
      sympy: "2*Rational(22,7)*7*10"
    why_after_previous: "L10 built the formula shape; L11 is the realistic-number version, chosen with $r=7$ so $\\pi=22/7$ cancels cleanly."
    prepares_for: "L12's MCQ, which reuses this exact cylinder and asks for the total instead."
    status: review

  - id: q_c9_sav_l012
    concepts: [c9.sav.cylinder]
    difficulty: 2
    type: mcq
    marks: 1
    level: 12
    stage: GUIDED_PRACTICE
    purpose: [MISCONCEPTION_CHECK]
    stem: "A cylinder has radius $7$ cm and height $10$ cm (the same cylinder as before). What is its total surface area? (Use $\\pi = \\frac{22}{7}$.)"
    options: ["$748\\text{ cm}^2$", "$440\\text{ cm}^2$", "$1540\\text{ cm}^2$", "$308\\text{ cm}^2$"]
    answer: 0
    distractors:
      1: c9.sav.cyl.curved_for_total
      2: generic.misread_question
      3: generic.arithmetic_slip
    hints:
      - "Total surface area adds the two circular ends to the curved surface: $2\\pi r h + 2\\pi r^2 = 2\\pi r(r+h)$."
    solution_steps:
      - "TSA $= 2\\pi r(r+h) = 2 \\times \\frac{22}{7} \\times 7 \\times (7+10) = 44 \\times 17 = 748\\ \\text{cm}^2$"
      - "The curved surface area alone (from L11) was only $440\\ \\text{cm}^2$ — that is not the total."
    verification:
      sympy: "2*Rational(22,7)*7*(7+10)"
      option_values: ["2*Rational(22,7)*7*(7+10)", "2*Rational(22,7)*7*10", "Rational(22,7)*7**2*10", "Rational(22,7)*7**2"]
    why_after_previous: "L11 asked for CSA directly; L12 reuses the same numbers and asks for the total, so a learner who defaults to 'the cylinder formula' without checking which quantity is asked picks the CSA distractor."
    prepares_for: "L13's volume of the same cylinder, and every later curved-vs-total discrimination in the mission."
    status: review

  - id: q_c9_sav_l013
    concepts: [c9.sav.cylinder]
    difficulty: 2
    type: numeric
    marks: 1
    level: 13
    stage: GUIDED_PRACTICE
    purpose: [BASIC_APPLICATION]
    stem: "Find the volume of the same cylinder (radius $7$ cm, height $10$ cm). (Use $\\pi = \\frac{22}{7}$.)"
    answers: ["1540"]
    unit: "cm^3"
    wrong_answers:
      "440": generic.misread_question
      "748": generic.misread_question
    hints:
      - "Volume $= \\pi r^2 h$."
    solution_steps:
      - "Volume $= \\frac{22}{7} \\times 7^2 \\times 10 = 22 \\times 7 \\times 10 = 1540\\ \\text{cm}^3$"
    verification:
      sympy: "Rational(22,7)*7**2*10"
    why_after_previous: "Third and final question on this one cylinder: after CSA (L11) and TSA (L12), volume completes the trio before moving to the cone."
    prepares_for: "L26's reverse cylinder problem, which uses this exact volume formula backwards."
    status: review

  - id: q_c9_sav_l014
    concepts: [c9.sav.cone]
    difficulty: 1
    type: mcq
    marks: 1
    level: 14
    stage: GUIDED_PRACTICE
    purpose: [INTRODUCTION, RECOGNITION]
    stem: "A right circular cone has three key lengths: $r$ (base radius), $h$ (the vertical height from the apex straight down to the base), and $l$ (the slant height, from the apex down the sloping surface to the base). Which one is measured along the cone's sloping outer surface?"
    options: ["The slant height $l$", "The radius $r$", "The height $h$", "None of them"]
    answer: 0
    distractors:
      1: generic.misread_question
      2: c9.sav.cone.height_for_slant
      3: generic.misread_question
    hints:
      - "Picture running your finger from the tip of the cone down its outside surface to the base edge — which length is that?"
    solution_steps:
      - "The slant height $l$ runs along the cone's outer sloping surface; $h$ is the straight vertical height inside the cone, and $r$ is the base radius."
    why_after_previous: "First cone level: establishes the $r$/$h$/$l$ distinction that the rest of the mission's cone questions depend on."
    prepares_for: "L15, which computes $l$ from $r$ and $h$ using Pythagoras."
    status: review

  - id: q_c9_sav_l015
    concepts: [c9.sav.cone]
    difficulty: 2
    type: numeric
    marks: 1
    level: 15
    stage: GUIDED_PRACTICE
    purpose: [COMBINATION]
    stem: "A cone has radius $6$ cm and height $8$ cm. Find its slant height."
    answers: ["10"]
    unit: "cm"
    wrong_answers:
      "14": generic.arithmetic_slip
      "2": generic.arithmetic_slip
    hints:
      - "The radius, height and slant height form a right triangle: $l^2 = r^2 + h^2$ (this is the Pythagoras rule from Class 8)."
      - "$l = \\sqrt{6^2 + 8^2} = \\sqrt{36+64} = \\sqrt{100}$"
    solution_steps:
      - "$l = \\sqrt{r^2+h^2} = \\sqrt{6^2+8^2} = \\sqrt{100} = 10\\ \\text{cm}$"
    verification:
      sympy: "sqrt(6**2+8**2)"
    why_after_previous: "L14 named $l$; L15 is the first level that actually computes it, bridging to the Class 8 Pythagoras prerequisite."
    prepares_for: "L16, which uses this exact $l$ to find the cone's curved surface area."
    status: review

  - id: q_c9_sav_l016
    concepts: [c9.sav.cone]
    difficulty: 2
    type: numeric
    marks: 1
    level: 16
    stage: GUIDED_PRACTICE
    purpose: [PROCEDURAL_FLUENCY]
    stem: "Using the cone from before (radius $6$ cm, height $8$ cm, slant height $10$ cm), find its curved surface area. (Use $\\pi = 3.14$.)"
    answers: ["188.4"]
    unit: "cm^2"
    wrong_answers:
      "150.72": c9.sav.cone.height_for_slant
    hints:
      - "Curved surface area $= \\pi r l$, using the slant height $l$, not $h$."
    solution_steps:
      - "CSA $= \\pi r l = 3.14 \\times 6 \\times 10 = 188.4\\ \\text{cm}^2$"
    verification:
      sympy: "3.14*6*10"
    why_after_previous: "L15 found $l$ in isolation; L16 applies it immediately, still telling the learner explicitly to use $l$."
    prepares_for: "L17, which removes that explicit instruction."
    status: review

  - id: q_c9_sav_l017
    concepts: [c9.sav.cone]
    difficulty: 2
    type: mcq
    marks: 1
    level: 17
    stage: GUIDED_PRACTICE
    purpose: [MISCONCEPTION_CHECK, STRATEGY_SELECTION]
    stem: "A cone has radius $6$ cm and height $8$ cm. What is its curved surface area? (Use $\\pi = 3.14$.)"
    options: ["$188.4\\text{ cm}^2$", "$150.72\\text{ cm}^2$", "$301.44\\text{ cm}^3$", "$62.8\\text{ cm}^2$"]
    answer: 0
    distractors:
      1: c9.sav.cone.height_for_slant
      2: c9.sav.cone.no_third
      3: generic.arithmetic_slip
    hints:
      - "The formula needs the slant height $l$, not $h$. Have you found $l$ yet?"
      - "$l = \\sqrt{r^2+h^2} = \\sqrt{36+64} = 10$. Now use CSA $= \\pi r l$."
    solution_steps:
      - "The slant height is not given directly: $l = \\sqrt{6^2+8^2} = 10$."
      - "CSA $= \\pi r l = 3.14 \\times 6 \\times 10 = 188.4\\ \\text{cm}^2$."
    verification:
      sympy: "3.14*6*10"
      option_values: ["3.14*6*10", "3.14*6*8", "Rational(1,3)*3.14*6**2*8", "3.14*2*10"]
    why_after_previous: "L16 was told explicitly to use $l$; L17 removes that instruction and adds an $h$-shaped distractor, forcing the learner to recall on their own that CSA needs $l$."
    prepares_for: "L27's cone reverse problem, and L33's error-analysis re-test — the l-vs-h confusion is this chapter's single most tested cone misconception."
    status: review

  - id: q_c9_sav_l018
    concepts: [c9.sav.pyramid]
    difficulty: 1
    type: mcq
    marks: 1
    level: 18
    stage: GUIDED_PRACTICE
    purpose: [INTRODUCTION, VARIATION]
    stem: "A pyramid stands on a square base, with four triangular faces meeting at an apex. Each triangular face has its own slant height (from the apex down the middle of that face to the base edge). Which of these is generally NOT the same as the pyramid's own vertical height (measured straight up from the base's centre to the apex)?"
    options: ["A triangular face's slant height", "The base's side length", "The base's area", "None — they're all the same as the vertical height"]
    answer: 0
    distractors:
      1: generic.misread_question
      2: generic.misread_question
      3: c9.sav.pyr.vertical_for_slant
    hints:
      - "The vertical height goes straight up from the centre of the base; a face's slant height goes up along the middle of a tilted triangular face. Are these the same line?"
    solution_steps:
      - "The vertical height and a face's slant height are different lengths (the slant height is always longer, since it's the hypotenuse of a right triangle formed with half the base and the vertical height)."
      - "Confusing them is the single most common pyramid error in this chapter."
    why_after_previous: "First pyramid level: surfaces the slant-vs-vertical-height distinction before any computation is asked, the same way L14 did for the cone's $l$ vs $h$."
    prepares_for: "L19, the Guided Practice checkpoint, which requires using both correctly."
    status: review

  - id: q_c9_sav_l019
    concepts: [c9.sav.pyramid, c9.sav.cuboid_cube]
    difficulty: 2
    type: case_based
    marks: 2
    level: 19
    stage: GUIDED_PRACTICE
    purpose: [REVIEW, COMBINATION]
    stem: "Guided Practice checkpoint. A pyramid has a square base of side $6$ cm, vertical height $4$ cm, and each triangular face has slant height $5$ cm (measured up the middle of the face)."
    parts:
      - type: numeric
        marks: 1
        stem: "Find the pyramid's volume."
        answers: ["48"]
        unit: "cm^3"
        wrong_answers:
          "144": c9.sav.pyr.no_third
        solution_steps:
          - "Volume $= \\frac{1}{3} \\times \\text{base area} \\times \\text{height} = \\frac{1}{3} \\times 6^2 \\times 4 = \\frac{1}{3} \\times 36 \\times 4 = 48\\ \\text{cm}^3$"
        verification:
          sympy: "Rational(1,3)*36*4"
      - type: numeric
        marks: 1
        stem: "Find the pyramid's total surface area."
        answers: ["96"]
        unit: "cm^2"
        wrong_answers:
          "60": c9.sav.pyr.vertical_for_slant
        solution_steps:
          - "TSA $=$ base area $+$ (4 triangular faces) $= 6^2 + 4 \\times \\left(\\frac{1}{2} \\times 6 \\times 5\\right) = 36 + 60 = 96\\ \\text{cm}^2$"
          - "Each triangular face uses the slant height $5$ cm, not the pyramid's vertical height $4$ cm."
        verification:
          sympy: "36 + 4*(Rational(1,2)*6*5)"

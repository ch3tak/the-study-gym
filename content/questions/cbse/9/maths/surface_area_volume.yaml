  - id: q_c9_sav_l061
    concepts: [c9.sav.cylinder, c9.sav.sphere_hemisphere, c9.sav.units]
    difficulty: 3
    type: case_based
    marks: 5
    level: 61
    stage: MASTERY
    purpose: [CBSE_STYLE, HIGHER_ORDER, CHALLENGE]
    stem: "A water tank is shaped like a cylinder of radius $7$ m and height $10$ m, with a hemispherical dome of the same radius on top (used only as a roof, not filled with water). (Use $\\pi = \\frac{22}{7}$ for area; leave volume answers exact, in terms of $\\pi$ where needed.)"
    parts:
      - type: numeric
        marks: 1
        stem: "Find the volume of water the cylindrical part alone can hold, in litres."
        answers: ["1540000"]
        unit: "L"
        solution_steps:
          - "Cylinder volume $= \\frac{22}{7} \\times 7^2 \\times 10 = 1540\\ \\text{m}^3 = 1{,}540{,}000\\ \\text{L}$"
        verification:
          sympy: "Rational(22,7)*7**2*10*1000"
      - type: numeric
        marks: 2
        stem: "Find the total outer curved surface area to be painted: the cylinder's curved surface plus the dome's curved surface (the flat top where the dome sits is internal, and the base is on the ground, so neither is painted)."
        answers: ["748"]
        unit: "m^2"
        wrong_answers:
          "1056": c9.sav.combo.double_counts_shared_face
        solution_steps:
          - "Cylinder's curved surface $= 2\\pi rh = 2 \\times \\frac{22}{7} \\times 7 \\times 10 = 440\\ \\text{m}^2$"
          - "Dome's curved surface (a hemisphere) $= 2\\pi r^2 = 2 \\times \\frac{22}{7} \\times 49 = 308\\ \\text{m}^2$"
          - "Total $= 440 + 308 = 748\\ \\text{m}^2$"
        verification:
          sympy: "2*Rational(22,7)*7*10 + 2*Rational(22,7)*7**2"
      - type: numeric
        marks: 2
        stem: "If the tank (cylinder plus dome) must hold a total of $\\frac{2450}{3}\\pi\\ \\text{m}^3$ of enclosed space (water plus the dome's air), and the radius stays $7$ m, what must the cylinder's height be?"
        answers: ["12"]
        unit: "m"
        solution_steps:
          - "Dome's volume $= \\frac{2}{3}\\pi r^3 = \\frac{2}{3}\\pi(343) = \\frac{686}{3}\\pi\\ \\text{m}^3$"
          - "Cylinder's volume needed $= \\frac{2450}{3}\\pi - \\frac{686}{3}\\pi = \\frac{1764}{3}\\pi = 588\\pi\\ \\text{m}^3$"
          - "$588\\pi = \\pi(7)^2 h = 49\\pi h$, so $h = \\frac{588}{49} = 12\\ \\text{m}$"
        verification:
          sympy: "positive_roots(pi*7**2*x + Rational(2,3)*pi*7**3 - Rational(2450,3)*pi, x)"
    why_after_previous: "The mission's fullest Section-E-style case: a real-world composite object, a unit conversion, a straightforward area computation, and a reverse sub-question, all in one four-part scenario — the complete board-pattern question the blueprint's §4 and §10 both point toward."
    prepares_for: "L62, the mission's final gateway level before the standalone Final Mastery Test."
    status: review


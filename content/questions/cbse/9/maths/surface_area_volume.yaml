  - id: q_c9_sav_l056
    concepts: [c9.sav.cone, c9.sav.cylinder]
    difficulty: 3
    type: case_based
    marks: 3
    level: 56
    stage: MASTERY
    purpose: [TRANSFER, MULTI_STEP]
    stem: "The silo from before has radius $7$ m; its cylindrical body is $15$ m tall, and its conical roof is $24$ m tall. (Use $\\pi = \\frac{22}{7}$.)"
    parts:
      - type: numeric
        marks: 2
        stem: "Find the silo's total surface area (the cylinder's curved surface, the cone's curved surface, and the flat circular base — the top where the cone meets the cylinder is internal and not counted)."
        answers: ["1210"]
        unit: "m^2"
        solution_steps:
          - "Cone's slant height $l = \\sqrt{7^2+24^2} = \\sqrt{625} = 25\\ \\text{m}$"
          - "Cylinder's curved surface $= 2\\pi rh = 2 \\times \\frac{22}{7} \\times 7 \\times 15 = 660\\ \\text{m}^2$"
          - "Cone's curved surface $= \\pi r l = \\frac{22}{7} \\times 7 \\times 25 = 550\\ \\text{m}^2$"
          - "Total $= 660 + 550 = 1210\\ \\text{m}^2$ (the base is buried/not painted in this scenario, so it is excluded)."
        verification:
          sympy: "2*Rational(22,7)*7*15 + Rational(22,7)*7*25"
      - type: numeric
        marks: 1
        stem: "Find the silo's total volume."
        answers: ["3542"]
        unit: "m^3"
        solution_steps:
          - "Cylinder's volume $= \\frac{22}{7} \\times 7^2 \\times 15 = 2310\\ \\text{m}^3$"
          - "Cone's volume $= \\frac{1}{3} \\times \\frac{22}{7} \\times 7^2 \\times 24 = 1232\\ \\text{m}^3$"
          - "Total $= 2310 + 1232 = 3542\\ \\text{m}^3$"
        verification:
          sympy: "Rational(22,7)*7**2*15 + Rational(1,3)*Rational(22,7)*7**2*24"
    why_after_previous: "Continues L55's silo with actual numbers, requiring both surface area (with a deliberate judgement call about which faces count) and volume for a decomposition the learner identified themselves."
    prepares_for: "L57's hemispherical bowl, which introduces a different kind of unfamiliar framing (an indirect given)."

    prepares_for: "L59's final misconception re-test, which returns to concrete computation after this abstract reasoning step."
    status: review

  - id: q_c9_sav_l059
    concepts: [c9.sav.cylinder, c9.sav.sphere_hemisphere, c9.sav.units]
    difficulty: 3
    type: mcq
    marks: 1
    level: 59
    stage: MASTERY
    purpose: [ERROR_ANALYSIS, REVIEW, HIGHER_ORDER]
    stem: "A capsule is a cylinder of radius $3$ cm and height $10$ cm with a hemisphere attached at each end. A student computes its total surface area as: $2\\pi rh + 2(2\\pi r^2) = 2\\pi(3)(10) + 2(2\\pi(3)^2) = 60\\pi + 36\\pi = 96\\pi\\text{ cm}^2$. Is this correct?"
    options: ["Yes, this is correct.", "No — the cylinder's flat circular ends should have been included too.", "No — a flat face should have been included for each hemisphere.", "No — the volume formula was used instead of the surface-area formula."]
    answer: 0
    distractors:
      1: c9.sav.combo.double_counts_shared_face
      2: c9.sav.combo.double_counts_shared_face
      3: generic.misread_question
    hints:
      - "Think about what happens at the join between the cylinder and each hemisphere: is there a face there, or not?"
      - "None of the flat faces exist here — check each term against what the capsule's actual shape needs before assuming an error exists."
    solution_steps:
      - "This is the mission's one deliberately CORRECT 'spot the error' problem: the cylinder's flat ends are exactly where the hemispheres attach, so they are internal and rightly excluded."
      - "Each hemisphere contributes only its curved area ($2\\pi r^2$), with no flat face of its own, since that face is exactly where it joins the cylinder."
      - "The given computation, $96\\pi\\ \\text{cm}^2$, is correct — this tests whether the learner has truly internalised the shared-face rule rather than assuming every composite-solid question must contain an error."
    verification:
      note: "Correctness of the STUDENT'S working (96π cm²) checked separately: 2*pi*3*10 + 2*(2*pi*3**2) = 96*pi, confirmed correct. Options are text judgments, not numeric values, so no option_values applies here — route to human review."
    why_after_previous: "L49-L50 taught the capsule shape with the shared-face error present; L59 revisits the identical shape but removes the error, testing recognition of correctness — a harder and more honest test than always presenting a flawed solution."
    prepares_for: "The Final Mastery Test, which mixes correct and flawed reasoning without flagging which is which."
    status: review


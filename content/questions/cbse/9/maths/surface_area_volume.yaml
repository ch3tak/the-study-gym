          sympy: "2200/(Rational(22,7)*7**2)"
          tolerance: 0.01
      - type: mcq
        marks: 2
        stem: "For the same volume, which container generally uses LESS material (has smaller total surface area) — a cylinder, or a cube?"
        options: ["It depends on the exact proportions, but a shape closer to a sphere (which a squat, wide cylinder approaches) is usually more efficient than a cube.", "A cube always uses less material than any cylinder of equal volume.", "A cylinder always uses less material than any cube of equal volume.", "Surface area only depends on volume, so both always use exactly the same material."]
        answer: 0
        distractors:

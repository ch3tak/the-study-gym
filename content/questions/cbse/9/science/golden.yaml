# Hand-written golden examples for Class 9 Science: one or more per question type.
# Reference shape for generate.py's few-shot prompt and validator fixtures.
questions:

  - id: q_c9_acceleration_0001
    concepts: [c9.motion.acceleration]
    difficulty: 1
    type: numeric
    cbse_section: A
    marks: 1
    stem: "A bus moving at $10$ m/s speeds up to $25$ m/s in $5$ s. Find its acceleration."
    answers: ["3"]
    unit: "m/s^2"
    wrong_answers:
      "5": c9.motion.acc.final_only
      "75": c9.motion.acc.multiplies
    hints:
      - "Acceleration is the change in velocity divided by the time taken."
    solution_steps:
      - "$a = \\frac{v - u}{t} = \\frac{25 - 10}{5}$"
      - "$a = 3\\ \\text{m/s}^2$"
    verification:
      sympy: "(25 - 10)/5"
    status: review

  - id: q_c9_mass_percent_0001
    concepts: [c9.mix.concentration_mass_mass]
    difficulty: 2
    type: mcq
    cbse_section: A
    marks: 1
    stem: "Meera dissolves $20$ g of salt in $180$ g of water. What is the mass by mass percentage of the solution?"
    options: ["$10\\%$", "$11.1\\%$", "$0.1\\%$", "$20\\%$"]
    answer: 0
    distractors:
      1: c9.mix.conc.solvent_as_solution
      2: c9.mix.conc.no_100
      3: generic.misread_question
    hints:
      - "The mass of the solution is solute + solvent."
    solution_steps:
      - "Mass of solution $= 20 + 180 = 200$ g"
      - "Mass % $= \\frac{20}{200} \\times 100 = 10\\%$"
    verification:
      sympy: "100*20/(20 + 180)"
      option_values: ["10", "100*20/180", "Rational(1, 10)", "20"]
    status: review

  - id: q_c9_neutrons_0001
    concepts: [c9.atom.mass_number]
    difficulty: 1
    type: numeric
    cbse_section: A
    marks: 1
    stem: "An atom of sodium has atomic number $11$ and mass number $23$. How many neutrons are in its nucleus?"
    answers: ["12"]
    unit: "none"
    wrong_answers:
      "34": c9.atom.mass.adds
      "11": c9.atom.mass.neutrons_equal_z
    hints:
      - "Mass number = protons + neutrons."
    solution_steps:
      - "Neutrons $= 23 - 11 = 12$"
    verification:
      sympy: "23 - 11"
    status: review

  - id: q_c9_sound_vacuum_ar_0001
    concepts: [c9.sound.propagation]
    difficulty: 1
    type: assertion_reason
    cbse_section: A
    marks: 1
    stem: "Read the Assertion (A) and Reason (R) and choose the correct option."
    assertion: "Sound cannot travel through a vacuum."
    reason: "Sound is a mechanical wave and needs a material medium to travel."
    answer: a
    solution_steps:
      - "Sound travels by vibrating particles of a medium; a vacuum has none. A is true and R explains it."
    status: review

  - id: q_c9_apical_meristem_0001
    concepts: [c9.tissue.meristematic]
    difficulty: 1
    type: mcq
    cbse_section: A
    marks: 1
    stem: "Which tissue is responsible for the increase in length of a plant's stem and root?"
    options: ["Apical meristem", "Intercalary meristem", "Lateral meristem", "Parenchyma"]
    answer: 0
    distractors:
      1: c9.tissue.mer.intercalary_confusion
      2: c9.tissue.mer.lateral_length
      3: c9.tissue.mer.permanent_divides
    hints:
      - "Think about where the stem and root tips grow from."
    solution_steps:
      - "Apical meristem at the tips of stems and roots divides to increase length."
      - "Lateral meristem increases girth; intercalary meristem acts at internodes; parenchyma is a permanent tissue."
    status: review

  - id: q_c9_falling_ball_case_0001
    concepts: [c9.work.conservation, c9.work.potential_energy]
    difficulty: 2
    type: case_based
    cbse_section: E
    marks: 4
    stem: >-
      During a science fair, Kabir drops a $0.5$ kg ball from the roof of his
      school, $20$ m above the ground. Take $g = 10\ \text{m/s}^2$ and ignore air
      resistance.
    parts:
      - type: numeric
        marks: 1
        stem: "What is the potential energy of the ball on the roof?"
        answers: ["100"]
        unit: "J"
        wrong_answers:
          "10": c9.work.pe.forgets_g
        solution_steps:
          - "$PE = mgh = 0.5 \\times 10 \\times 20 = 100\\ \\text{J}$"
        verification:
          sympy: "Rational(1, 2)*10*20"
      - type: mcq
        marks: 1
        stem: "What is the kinetic energy of the ball when it is $10$ m above the ground?"
        options: ["$50\\ \\text{J}$", "$100\\ \\text{J}$", "$0\\ \\text{J}$", "$25\\ \\text{J}$"]
        answer: 0
        distractors:
          1: generic.misread_question
          2: generic.misread_question
          3: c9.work.cons.energy_lost
        solution_steps:
          - "PE at $10$ m $= 0.5 \\times 10 \\times 10 = 50$ J."
          - "Total energy stays $100$ J, so $KE = 100 - 50 = 50$ J."
        verification:
          sympy: "Rational(1, 2)*10*20 - Rational(1, 2)*10*10"
          option_values: ["50", "100", "0", "25"]
      - type: numeric
        marks: 2
        stem: "With what speed does the ball hit the ground?"
        answers: ["20"]
        unit: "m/s"
        wrong_answers:
          "400": c9.work.cons.forgot_sqrt
        solution_steps:
          - "All $100$ J becomes kinetic energy: $\\frac{1}{2}mv^2 = mgh$."
          - "$v = \\sqrt{2gh} = \\sqrt{2 \\times 10 \\times 20} = 20\\ \\text{m/s}$"
        verification:
          sympy: "sqrt(2*10*20)"
    status: review
